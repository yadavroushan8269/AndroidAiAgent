<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5a400">
  <title>Add Entry - Hyma RMC Kokapet</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <div class="app-page">

    <header class="top-header">
      <div>
        <h1>Add Entry</h1>
        <p>Record vehicle entry and exit</p>
      </div>

      <button
        id="closeEntryBtn"
        class="header-action"
        type="button"
      >
        ×
      </button>
    </header>

    <main class="page-content">

      <form id="entryForm" class="entry-form">

        <div class="form-section">

          <h2>Vehicle Details</h2>

          <label for="entryDate">
            Date
          </label>

          <input
            id="entryDate"
            type="date"
            required
          >

          <label for="entryVehicle">
            Vehicle
          </label>

          <select id="entryVehicle" required>
            <option value="">
              Select vehicle
            </option>
          </select>

          <div id="noVehicleMessage" class="form-message"></div>

          <label for="vehicleType">
            Vehicle Type
          </label>

          <input
            id="vehicleType"
            type="text"
            placeholder="Vehicle type"
            readonly
          >

          <label for="driverName">
            Driver
          </label>

          <input
            id="driverName"
            type="text"
            placeholder="Driver name"
            readonly
          >

        </div>


        <div class="form-section">

          <h2>Entry & Exit Time</h2>

          <div class="time-grid">

            <div>
              <label for="entryTime">
                Entry Time
              </label>

              <input
                id="entryTime"
                type="time"
                required
              >
            </div>

            <div>
              <label for="exitTime">
                Exit Time
              </label>

              <input
                id="exitTime"
                type="time"
              >
            </div>

          </div>

          <div class="duration-card">

            <span>Total Duration</span>

            <strong id="calculatedDuration">
              0h 0m
            </strong>

          </div>

        </div>


        <div class="form-section">

          <h2>Purpose</h2>

          <label for="entryPurpose">
            Work Purpose
          </label>

          <select id="entryPurpose" required>

            <option value="">
              Select purpose
            </option>

            <option value="Concrete">
              Concrete / RMC
            </option>

            <option value="Material">
              Material Delivery
            </option>

            <option value="Earthwork">
              Earthwork
            </option>

            <option value="Equipment">
              Equipment
            </option>

            <option value="Water">
              Water Supply
            </option>

            <option value="Other">
              Other
            </option>

          </select>

          <label for="entryNotes">
            Notes
          </label>

          <textarea
            id="entryNotes"
            rows="3"
            placeholder="Optional notes..."
          ></textarea>

        </div>


        <div
          id="entryMessage"
          class="form-message"
        ></div>


        <button
          class="primary-btn full-width"
          type="submit"
        >
          Save Entry
        </button>


        <button
          id="cancelEntryBtn"
          class="secondary-btn full-width"
          type="button"
        >
          Cancel
        </button>

      </form>

    </main>


    <nav class="bottom-nav">

      <button
        class="nav-item"
        data-page="dashboard"
        type="button"
      >
        <span>⌂</span>
        <small>Home</small>
      </button>

      <button
        class="nav-item"
        data-page="vehicles"
        type="button"
      >
        <span>🚚</span>
        <small>Vehicles</small>
      </button>

      <button
        class="nav-item add-nav active"
        data-page="add-entry"
        type="button"
      >
        <span>+</span>
      </button>

      <button
        class="nav-item"
        data-page="calendar"
        type="button"
      >
        <span>▣</span>
        <small>Calendar</small>
      </button>

      <button
        class="nav-item"
        data-page="profile"
        type="button"
      >
        <span>👤</span>
        <small>You</small>
      </button>

    </nav>

  </div>

  <script src="../app.js"></script>

</body>
</html>
