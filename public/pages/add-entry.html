<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Add Entry — MY HOME GROUP</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <div class="page">

    <header class="app-header">

      <div class="app-header-inner">

        <a
          href="/dashboard"
          class="header-brand"
        >
          <div class="brand-logo">MH</div>

          <div>
            <strong>MY HOME GROUP</strong>
            <span>Add Vehicle Entry</span>
          </div>
        </a>

        <div class="header-actions">

          <a
            href="/pages/notifications.html"
            class="icon-btn"
          >
            🔔
            <span
              class="notification-badge hidden"
            >
              0
            </span>
          </a>

          <a
            href="/pages/profile.html"
            class="icon-btn"
          >
            👤
          </a>

        </div>

      </div>

    </header>

    <main class="page-content">

      <div class="page-title">

        <h1>ADD VEHICLE ENTRY</h1>

        <p>
          Vehicle → Entry → Exit → Automatic Duration
        </p>

      </div>

      <section class="card">

        <form id="entryForm">

          <div class="form-row">

            <div class="form-group">

              <label for="entryDate">
                Date
              </label>

              <input
                id="entryDate"
                class="form-control"
                type="date"
                required
              >

            </div>

            <div class="form-group">

              <label for="entryVehicle">
                Vehicle
              </label>

              <select
                id="entryVehicle"
                class="form-control"
                required
              >
                <option value="">
                  Loading...
                </option>
              </select>

            </div>

          </div>

          <div class="form-row">

            <div class="form-group">

              <label for="entryDriver">
                Driver
              </label>

              <input
                id="entryDriver"
                class="form-control"
                type="text"
                placeholder="Driver"
              >

            </div>

            <div class="form-group">

              <label for="entryContractor">
                Contractor
              </label>

              <input
                id="entryContractor"
                class="form-control"
                type="text"
                placeholder="Contractor"
              >

            </div>

          </div>

          <div class="form-row">

            <div class="form-group">

              <label for="entryTime">
                Entry Time
              </label>

              <input
                id="entryTime"
                class="form-control"
                type="time"
                required
              >

            </div>

            <div class="form-group">

              <label for="exitTime">
                Exit Time
              </label>

              <input
                id="exitTime"
                class="form-control"
                type="time"
              >

            </div>

          </div>

          <div class="form-group">

            <label>
              Duration
            </label>

            <div
              class="form-control"
              style="
                display:flex;
                align-items:center;
                background:#09151f;
              "
            >
              <strong
                id="entryDuration"
                class="text-success"
              >
                —
              </strong>
            </div>

            <small class="muted">
              Exit Time blank hone par vehicle Running rahega.
            </small>

          </div>

          <div class="form-group">

            <label for="entryPurpose">
              Purpose
            </label>

            <input
              id="entryPurpose"
              class="form-control"
              type="text"
              placeholder="Purpose"
            >

          </div>

          <div class="form-group">

            <label for="entryNotes">
              Notes
            </label>

            <textarea
              id="entryNotes"
              class="form-control"
              placeholder="Notes"
            ></textarea>

          </div>

          <button
            id="saveEntryButton"
            class="btn btn-primary btn-large"
            type="submit"
          >
            SAVE ENTRY
          </button>

        </form>

      </section>

    </main>

    <nav class="bottom-nav">

      <div class="bottom-nav-inner">

        <a href="/dashboard">
          <span>🏠</span>
          <span>Home</span>
        </a>

        <a href="/pages/vehicles.html">
          <span>🚚</span>
          <span>Vehicles</span>
        </a>

        <a
          href="/pages/add-entry.html"
          class="active entry-button"
        >
          <span>＋</span>
          <span>Entry</span>
        </a>

        <a href="/pages/calendar.html">
          <span>📅</span>
          <span>Calendar</span>
        </a>

        <a href="/pages/profile.html">
          <span>👤</span>
          <span>You</span>
        </a>

      </div>

    </nav>

  </div>

  <script src="/app.js"></script>

</body>
</html>
