<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Add Entry - My Home Group</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

  <style>
    .page-wrap{
      max-width:900px;
      margin:0 auto;
      padding:20px;
      padding-bottom:100px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:20px;
    }

    .topbar h1{
      margin:0;
      font-size:25px;
    }

    .topbar p{
      margin:5px 0 0;
      opacity:.7;
      font-size:14px;
    }

    .btn{
      border:0;
      border-radius:10px;
      padding:11px 16px;
      cursor:pointer;
      font-weight:700;
      font-size:14px;
    }

    .btn-primary{
      background:#f5b400;
      color:#111;
    }

    .btn-secondary{
      background:#eef1f4;
      color:#222;
    }

    .card{
      background:#fff;
      border:1px solid #e3e7eb;
      border-radius:16px;
      padding:20px;
      box-shadow:0 3px 14px rgba(0,0,0,.05);
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .form-group{
      margin-bottom:14px;
    }

    .full{
      grid-column:1 / -1;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin-bottom:6px;
    }

    input,
    select,
    textarea{
      width:100%;
      box-sizing:border-box;
      border:1px solid #d8dde3;
      border-radius:10px;
      padding:12px;
      background:#fff;
      font-size:14px;
      outline:none;
    }

    input:focus,
    select:focus,
    textarea:focus{
      border-color:#f5b400;
      box-shadow:0 0 0 3px rgba(245,180,0,.12);
    }

    textarea{
      min-height:100px;
      resize:vertical;
    }

    .vehicle-info{
      background:#f7f8fa;
      border-radius:12px;
      padding:14px;
      margin-top:5px;
      display:none;
    }

    .vehicle-info.show{
      display:block;
    }

    .vehicle-info-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }

    .info-item{
      font-size:12px;
    }

    .info-label{
      opacity:.6;
      margin-bottom:3px;
    }

    .info-value{
      font-weight:700;
      word-break:break-word;
    }

    .duration-box{
      margin-top:4px;
      background:#fff8df;
      border:1px solid #f5d56b;
      border-radius:12px;
      padding:15px;
    }

    .duration-label{
      font-size:12px;
      opacity:.7;
    }

    .duration-value{
      font-size:25px;
      font-weight:800;
      margin-top:4px;
    }

    .running-note{
      color:#16803c;
      font-size:12px;
      margin-top:5px;
    }

    .form-actions{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      margin-top:20px;
    }

    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .loading{
      text-align:center;
      padding:30px;
      opacity:.7;
    }

    .error-box{
      background:#ffe9eb;
      color:#a71929;
      border-radius:10px;
      padding:12px;
      margin-bottom:15px;
      display:none;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:25px;
      transform:translateX(-50%) translateY(100px);
      background:#16191d;
      color:#fff;
      padding:12px 18px;
      border-radius:10px;
      font-size:14px;
      z-index:9999;
      transition:.25s ease;
      max-width:90%;
      text-align:center;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
    }

    .toast.error{
      background:#c62828;
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:5000;
      display:flex;
      justify-content:space-around;
      background:#fff;
      border-top:1px solid #ddd;
      padding:8px 5px calc(8px + env(safe-area-inset-bottom));
      box-shadow:0 -3px 12px rgba(0,0,0,.06);
    }

    .bottom-nav a{
      text-decoration:none;
      color:#555;
      font-size:11px;
      text-align:center;
      padding:6px 8px;
    }

    .bottom-nav a.active{
      color:#111;
      font-weight:800;
    }

    @media(max-width:650px){
      .page-wrap{
        padding:15px;
        padding-bottom:95px;
      }

      .topbar{
        align-items:flex-start;
      }

      .topbar h1{
        font-size:22px;
      }

      .form-grid{
        grid-template-columns:1fr;
      }

      .full{
        grid-column:auto;
      }

      .vehicle-info-grid{
        grid-template-columns:1fr 1fr;
      }

      .form-actions{
        flex-direction:column;
      }

      .form-actions .btn{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <main class="page-wrap">

    <header class="topbar">

      <div>
        <h1>➕ Add Entry</h1>

        <p>
          Record vehicle entry and exit duration
        </p>
      </div>

      <button
        class="btn btn-secondary"
        type="button"
        onclick="window.location.href='dashboard.html'"
      >
        Dashboard
      </button>

    </header>


    <section class="card">

      <div
        id="errorBox"
        class="error-box"
      ></div>


      <form id="entryForm">

        <div class="form-grid">


          <!-- DATE -->

          <div class="form-group">

            <label for="entryDate">
              Date *
            </label>

            <input
              id="entryDate"
              type="date"
              required
            >

          </div>


          <!-- VEHICLE -->

          <div class="form-group">

            <label for="vehicleSelect">
              Vehicle *
            </label>

            <select
              id="vehicleSelect"
              required
            >

              <option value="">
                Loading vehicles...
              </option>

            </select>

          </div>


          <!-- VEHICLE INFO -->

          <div
            id="vehicleInfo"
            class="vehicle-info full"
          >

            <div class="vehicle-info-grid">

              <div class="info-item">

                <div class="info-label">
                  Vehicle
                </div>

                <div
                  id="infoVehicle"
                  class="info-value"
                >
                  -
                </div>

              </div>


              <div class="info-item">

                <div class="info-label">
                  Type
                </div>

                <div
                  id="infoType"
                  class="info-value"
                >
                  -
                </div>

              </div>


              <div class="info-item">

                <div class="info-label">
                  Status
                </div>

                <div
                  id="infoStatus"
                  class="info-value"
                >
                  -
                </div>

              </div>

            </div>

          </div>


          <!-- DRIVER -->

          <div class="form-group">

            <label for="driverName">
              Driver
            </label>

            <input
              id="driverName"
              type="text"
              placeholder="Driver name"
            >

          </div>


          <!-- CONTRACTOR -->

          <div class="form-group">

            <label for="contractor">
              Contractor / Company
            </label>

            <input
              id="contractor"
              type="text"
              placeholder="Contractor or company"
            >

          </div>


          <!-- ENTRY TIME -->

          <div class="form-group">

            <label for="entryTime">
              Entry Time *
            </label>

            <input
              id="entryTime"
              type="time"
              required
            >

          </div>


          <!-- EXIT TIME -->

          <div class="form-group">

            <label for="exitTime">
              Exit Time
            </label>

            <input
              id="exitTime"
              type="time"
            >

          </div>


          <!-- DURATION -->

          <div class="form-group full">

            <div class="duration-box">

              <div class="duration-label">
                Calculated Duration
              </div>

              <div
                id="durationValue"
                class="duration-value"
              >
                0 min
              </div>

              <div
                id="runningNote"
                class="running-note"
              ></div>

            </div>

          </div>


          <!-- PURPOSE -->

          <div class="form-group full">

            <label for="purpose">
              Purpose
            </label>

            <input
              id="purpose"
              type="text"
              placeholder="Example: Concrete delivery"
              maxlength="180"
            >

          </div>


          <!-- NOTES -->

          <div class="form-group full">

            <label for="notes">
              Notes
            </label>

            <textarea
              id="notes"
              placeholder="Any additional information..."
            ></textarea>

          </div>


        </div>


        <div class="form-actions">

          <button
            type="button"
            class="btn btn-secondary"
            onclick="window.location.href='dashboard.html'"
          >
            Cancel
          </button>

          <button
            id="saveButton"
            type="submit"
            class="btn btn-primary"
          >
            Save Entry
          </button>

        </div>

      </form>

    </section>

  </main>


  <!-- MOBILE NAV -->

  <nav class="bottom-nav">

    <a href="dashboard.html">
      🏠<br>
      Home
    </a>

    <a href="vehicles.html">
      🚚<br>
      Vehicles
    </a>

    <a
      href="add-entry.html"
      class="active"
    >
      ➕<br>
      Entry
    </a>

    <a href="calendar.html">
      📅<br>
      Calendar
    </a>

    <a href="profile.html">
      👤<br>
      You
    </a>

  </nav>


  <div
    id="toast"
    class="toast"
  ></div>


  <script src="../app.js"></script>


  <script>
    "use strict";


    /* =====================================================
       STATE
    ===================================================== */

    let vehicles = [];

    let selectedVehicle = null;


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const form =
      document.getElementById(
        "entryForm"
      );

    const dateInput =
      document.getElementById(
        "entryDate"
      );

    const vehicleSelect =
      document.getElementById(
        "vehicleSelect"
      );

    const driverInput =
      document.getElementById(
        "driverName"
      );

    const contractorInput =
      document.getElementById(
        "contractor"
      );

    const entryTimeInput =
      document.getElementById(
        "entryTime"
      );

    const exitTimeInput =
      document.getElementById(
        "exitTime"
      );

    const durationValue =
      document.getElementById(
        "durationValue"
      );

    const runningNote =
      document.getElementById(
        "runningNote"
      );

    const vehicleInfo =
      document.getElementById(
        "vehicleInfo"
      );

    const errorBox =
      document.getElementById(
        "errorBox"
      );

    const saveButton =
      document.getElementById(
        "saveButton"
      );


    /* =====================================================
       TOAST
    ===================================================== */

    let toastTimer;


    function showToast(
      message,
      error = false
    ){

      const toast =
        document.getElementById(
          "toast"
        );


      toast.textContent =
        message;


      toast.classList.toggle(
        "error",
        error
      );


      toast.classList.add(
        "show"
      );


      clearTimeout(
        toastTimer
      );


      toastTimer =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },
          2800
        );

    }


    /* =====================================================
       ERROR
    ===================================================== */

    function showError(
      message
    ){

      errorBox.textContent =
        message;

      errorBox.style.display =
        "block";

    }


    function clearError(){

      errorBox.textContent =
        "";

      errorBox.style.display =
        "none";

    }


    /* =====================================================
       DEFAULT TIME
    ===================================================== */

    function setCurrentTime(){

      const now =
        new Date();


      const hours =
        String(
          now.getHours()
        ).padStart(2,"0");


      const minutes =
        String(
          now.getMinutes()
        ).padStart(2,"0");


      entryTimeInput.value =
        `${hours}:${minutes}`;

    }


    /* =====================================================
       LOAD VEHICLES
    ===================================================== */

    async function loadVehicles(){

      try{

        vehicles =
          await window.MyHomeGroup
            .getVehicles();


        const activeVehicles =
          vehicles.filter(
            vehicle =>
              vehicle.status ===
              "Active"
          );


        vehicleSelect.innerHTML = `
          <option value="">
            Select vehicle
          </option>
        `;


        activeVehicles.forEach(
          vehicle => {

            const option =
              document.createElement(
                "option"
              );


            option.value =
              vehicle.id;


            option.textContent =
              `${vehicle.vehicle_number} — ${vehicle.vehicle_type}`;


            vehicleSelect.appendChild(
              option
            );

          }
        );


        if(
          activeVehicles.length === 0
        ){

          vehicleSelect.innerHTML = `
            <option value="">
              No active vehicles found
            </option>
          `;

          showError(
            "No active vehicles found. Please add an active vehicle first."
          );

        }

      }catch(error){

        console.error(
          error
        );


        vehicleSelect.innerHTML = `
          <option value="">
            Unable to load vehicles
          </option>
        `;


        showError(
          error.message ||
          "Unable to load vehicles."
        );

      }

    }


    /* =====================================================
       VEHICLE SELECT
    ===================================================== */

    function handleVehicleChange(){

      const id =
        Number(
          vehicleSelect.value
        );


      selectedVehicle =
        vehicles.find(
          vehicle =>
            Number(
              vehicle.id
            ) === id
        ) || null;


      if(
        !selectedVehicle
      ){

        vehicleInfo.classList.remove(
          "show"
        );

        driverInput.value =
          "";

        contractorInput.value =
          "";

        return;

      }


      vehicleInfo.classList.add(
        "show"
      );


      document.getElementById(
        "infoVehicle"
      ).textContent =
        selectedVehicle.vehicle_number ||
        "-";


      document.getElementById(
        "infoType"
      ).textContent =
        selectedVehicle.vehicle_type ||
        "-";


      document.getElementById(
        "infoStatus"
      ).textContent =
        selectedVehicle.status ||
        "-";


      /*
        Auto-fill driver and contractor.
        User can still edit them for this entry.
      */

      driverInput.value =
        selectedVehicle.driver_name ||
        "";


      contractorInput.value =
        selectedVehicle.contractor ||
        "";

    }


    /* =====================================================
       DURATION
    ===================================================== */

    function updateDuration(){

      const entryTime =
        entryTimeInput.value;


      const exitTime =
        exitTimeInput.value;


      if(
        !entryTime
      ){

        durationValue.textContent =
          "0 min";

        runningNote.textContent =
          "";

        return;

      }


      if(
        !exitTime
      ){

        durationValue.textContent =
          "Running";


        runningNote.textContent =
          "Exit time is not entered yet. Duration will be updated when you save an exit time.";


        return;

      }


      const minutes =
        window.MyHomeGroup
          .calculateDuration(
            entryTime,
            exitTime
          );


      durationValue.textContent =
        window.MyHomeGroup
          .durationText(
            minutes
          );


      runningNote.textContent =
        "";

    }


    /* =====================================================
       VALIDATION
    ===================================================== */

    function validateForm(){

      clearError();


      if(
        !dateInput.value
      ){

        showError(
          "Please select a date."
        );

        dateInput.focus();

        return false;

      }


      if(
        !selectedVehicle
      ){

        showError(
          "Please select a vehicle."
        );

        vehicleSelect.focus();

        return false;

      }


      if(
        !entryTimeInput.value
      ){

        showError(
          "Please select entry time."
        );

        entryTimeInput.focus();

        return false;

      }


      if(
        exitTimeInput.value
      ){

        const duration =
          window.MyHomeGroup
            .calculateDuration(
              entryTimeInput.value,
              exitTimeInput.value
            );


        if(
          duration <= 0
        ){

          showError(
            "Exit time must be different from entry time."
          );

          exitTimeInput.focus();

          return false;

        }

      }


      return true;

    }


    /* =====================================================
       SAVE
    ===================================================== */

    async function saveEntry(
      event
    ){

      event.preventDefault();


      if(
        !validateForm()
      ){

        return;

      }


      const duration =
        exitTimeInput.value
          ? window.MyHomeGroup
              .calculateDuration(
                entryTimeInput.value,
                exitTimeInput.value
              )
          : 0;


      const payload = {

        vehicleId:
          Number(
            selectedVehicle.id
          ),

        vehicleNumber:
          selectedVehicle.vehicle_number,

        vehicleType:
          selectedVehicle.vehicle_type,

        driverName:
          driverInput.value.trim(),

        contractor:
          contractorInput.value.trim(),

        date:
          dateInput.value,

        entryTime:
          entryTimeInput.value,

        exitTime:
          exitTimeInput.value,

        duration,

        purpose:
          document.getElementById(
            "purpose"
          )
          .value
          .trim(),

        notes:
          document.getElementById(
            "notes"
          )
          .value
          .trim()

      };


      saveButton.disabled =
        true;


      saveButton.textContent =
        "Saving...";


      try{

        await window.MyHomeGroup
          .createEntry(
            payload
          );


        showToast(
          "Entry saved successfully."
        );


        /*
          Give the toast a moment,
          then return to dashboard.
        */

        setTimeout(
          () => {

            window.location.href =
              "dashboard.html";

          },
          700
        );

      }catch(error){

        console.error(
          error
        );


        showError(
          error.message ||
          "Unable to save entry."
        );


        showToast(
          error.message ||
          "Unable to save entry.",
          true
        );


        saveButton.disabled =
          false;


        saveButton.textContent =
          "Save Entry";

      }

    }


    /* =====================================================
       EVENTS
    ===================================================== */

    vehicleSelect
      .addEventListener(
        "change",
        handleVehicleChange
      );


    entryTimeInput
      .addEventListener(
        "input",
        updateDuration
      );


    exitTimeInput
      .addEventListener(
        "input",
        updateDuration
      );


    form
      .addEventListener(
        "submit",
        saveEntry
      );


    /* =====================================================
       INITIALIZE
    ===================================================== */

    dateInput.value =
      window.MyHomeGroup.today();


    setCurrentTime();

    updateDuration();

    loadVehicles();

  </script>

</body>
</html>
