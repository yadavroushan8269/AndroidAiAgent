<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Add Entry - My Home Group</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

</head>

<body>

<header class="app-header">

  <div class="app-header-inner">

    <a
      href="/pages/dashboard.html"
      class="app-brand"
    >

      <div class="app-brand-mark">
        MH
      </div>

      <div class="app-brand-text">

        <div class="app-brand-name">
          My Home Group
        </div>

        <div class="app-brand-subtitle">
          Vehicle Duration Management
        </div>

      </div>

    </a>

    <div class="header-actions">

      <a
        href="/pages/notifications.html"
        class="header-icon-btn"
      >
        🔔
        <span
          class="notification-badge hidden"
          data-notification-count
        ></span>
      </a>

      <a
        href="/pages/profile.html"
        class="header-icon-btn"
      >
        👤
      </a>

    </div>

  </div>

</header>

<div class="app-layout">

  <aside class="sidebar">

    <nav class="sidebar-nav">

      <a
        href="/pages/dashboard.html"
        class="nav-link"
      >
        <span class="nav-icon">🏠</span>
        Dashboard
      </a>

      <a
        href="/pages/vehicles.html"
        class="nav-link"
      >
        <span class="nav-icon">🚛</span>
        Vehicles
      </a>

      <a
        href="/pages/add-entry.html"
        class="nav-link active"
      >
        <span class="nav-icon">➕</span>
        Add Entry
      </a>

      <a
        href="/pages/calendar.html"
        class="nav-link"
      >
        <span class="nav-icon">📅</span>
        Calendar
      </a>

      <a
        href="/pages/reports.html"
        class="nav-link"
      >
        <span class="nav-icon">📊</span>
        Reports
      </a>

      <a
        href="/pages/notifications.html"
        class="nav-link"
      >
        <span class="nav-icon">🔔</span>
        Notifications
      </a>

      <a
        href="/pages/profile.html"
        class="nav-link"
      >
        <span class="nav-icon">👤</span>
        Profile
      </a>

      <a
        href="#"
        class="nav-link logout-btn"
      >
        <span class="nav-icon">🚪</span>
        Logout
      </a>

    </nav>

  </aside>

  <main class="main-content">

    <div class="content-inner">

      <div class="page-heading">

        <div class="page-heading-text">

          <h1>
            Add Vehicle Entry
          </h1>

          <p>
            Record vehicle entry and exit duration
          </p>

        </div>

      </div>

      <section class="card">

        <div class="card-body">

          <div id="entryMessage"></div>

          <form id="entryForm">

            <div class="form-grid">

              <div class="form-group">

                <label class="form-label">
                  Date
                </label>

                <input
                  id="entryDate"
                  type="date"
                  class="form-control"
                  required
                >

              </div>

              <div class="form-group">

                <label class="form-label">
                  Vehicle
                </label>

                <select
                  id="vehicleId"
                  class="form-control"
                  required
                >

                  <option value="">
                    Loading vehicles...
                  </option>

                </select>

              </div>

              <div class="form-group">

                <label class="form-label">
                  Vehicle Number
                </label>

                <input
                  id="vehicleNumber"
                  type="text"
                  class="form-control"
                  readonly
                >

              </div>

              <div class="form-group">

                <label class="form-label">
                  Vehicle Type
                </label>

                <input
                  id="vehicleType"
                  type="text"
                  class="form-control"
                  readonly
                >

              </div>

              <div class="form-group">

                <label class="form-label">
                  Driver
                </label>

                <input
                  id="driverName"
                  type="text"
                  class="form-control"
                >

              </div>

              <div class="form-group">

                <label class="form-label">
                  Contractor
                </label>

                <input
                  id="contractor"
                  type="text"
                  class="form-control"
                >

              </div>

              <div class="form-group">

                <label class="form-label">
                  Entry Time
                </label>

                <input
                  id="entryTime"
                  type="time"
                  class="form-control"
                  required
                >

              </div>

              <div class="form-group">

                <label class="form-label">
                  Exit Time
                </label>

                <input
                  id="exitTime"
                  type="time"
                  class="form-control"
                >

              </div>

              <div class="form-group full">

                <div class="duration-result">

                  <div class="duration-result-label">
                    Calculated Duration
                  </div>

                  <div
                    id="durationDisplay"
                    class="duration-result-value"
                  >
                    0m
                  </div>

                </div>

              </div>

              <div class="form-group">

                <label class="form-label">
                  Purpose
                </label>

                <input
                  id="purpose"
                  type="text"
                  class="form-control"
                  placeholder="e.g. Material delivery"
                >

              </div>

              <div class="form-group">

                <label class="form-label">
                  Notes
                </label>

                <input
                  id="notes"
                  type="text"
                  class="form-control"
                  placeholder="Optional notes"
                >

              </div>

            </div>

            <div class="form-actions">

              <a
                href="/pages/dashboard.html"
                class="btn btn-secondary"
              >
                Cancel
              </a>

              <button
                id="saveEntryButton"
                type="submit"
                class="btn btn-primary"
              >
                Save Entry
              </button>

            </div>

          </form>

        </div>

      </section>

    </div>

  </main>

</div>

<nav class="mobile-bottom-nav">

  <div class="mobile-nav-inner">

    <a
      href="/pages/dashboard.html"
      class="mobile-nav-item"
    >
      <span class="mobile-nav-icon">🏠</span>
      Home
    </a>

    <a
      href="/pages/vehicles.html"
      class="mobile-nav-item"
    >
      <span class="mobile-nav-icon">🚛</span>
      Vehicles
    </a>

    <a
      href="/pages/add-entry.html"
      class="mobile-nav-item add active"
    >
      <span class="mobile-nav-add">+</span>
      Entry
    </a>

    <a
      href="/pages/calendar.html"
      class="mobile-nav-item"
    >
      <span class="mobile-nav-icon">📅</span>
      Calendar
    </a>

    <a
      href="/pages/profile.html"
      class="mobile-nav-item"
    >
      <span class="mobile-nav-icon">👤</span>
      You
    </a>

  </div>

</nav>

<script src="../app.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const vehicleSelect =
    document.getElementById("vehicleId");

  const dateInput =
    document.getElementById("entryDate");

  const entryTime =
    document.getElementById("entryTime");

  const exitTime =
    document.getElementById("exitTime");

  const durationDisplay =
    document.getElementById("durationDisplay");

  let vehicles = [];

  dateInput.value =
    MyHomeGroup.todayString();

  const now = new Date();

  entryTime.value =
    `${String(now.getHours()).padStart(2, "0")}:${String(
      now.getMinutes()
    ).padStart(2, "0")}`;

  async function loadVehicles() {

    try {

      vehicles =
        await MyHomeGroup.getVehicles();

      const active =
        vehicles.filter(
          vehicle =>
            vehicle.status !== "Inactive"
        );

      if (!active.length) {

        vehicleSelect.innerHTML = `
          <option value="">
            No active vehicles found
          </option>
        `;

        return;
      }

      vehicleSelect.innerHTML = `
        <option value="">
          Select vehicle
        </option>
        ${
          active.map(vehicle => `
            <option value="${vehicle.id}">
              ${MyHomeGroup.escapeHtml(
                vehicle.vehicle_number
              )}
              -
              ${MyHomeGroup.escapeHtml(
                vehicle.vehicle_type || ""
              )}
          `).join("")
        }
      `;

    } catch (error) {

      vehicleSelect.innerHTML = `
        <option value="">
          Unable to load vehicles
        </option>
      `;

      MyHomeGroup.showToast(
        error.message,
        "error"
      );

    }

  }

  vehicleSelect.addEventListener(
    "change",
    () => {

      const vehicle =
        vehicles.find(
          item =>
            String(item.id) ===
            String(vehicleSelect.value)
        );

      if (!vehicle) {

        document.getElementById(
          "vehicleNumber"
        ).value = "";

        document.getElementById(
          "vehicleType"
        ).value = "";

        document.getElementById(
          "driverName"
        ).value = "";

        document.getElementById(
          "contractor"
        ).value = "";

        return;
      }

      document.getElementById(
        "vehicleNumber"
      ).value =
        vehicle.vehicle_number || "";

      document.getElementById(
        "vehicleType"
      ).value =
        vehicle.vehicle_type || "";

      document.getElementById(
        "driverName"
      ).value =
        vehicle.driver_name || "";

      document.getElementById(
        "contractor"
      ).value =
        vehicle.contractor || "";

    }
  );

  function updateDuration() {

    const minutes =
      MyHomeGroup.calculateDuration(
        entryTime.value,
        exitTime.value
      );

    durationDisplay.textContent =
      MyHomeGroup.minutesToDuration(
        minutes
      );

  }

  entryTime.addEventListener(
    "input",
    updateDuration
  );

  exitTime.addEventListener(
    "input",
    updateDuration
  );

  document
    .getElementById("entryForm")
    .addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        const message =
          document.getElementById(
            "entryMessage"
          );

        const button =
          document.getElementById(
            "saveEntryButton"
          );

        const vehicle =
          vehicles.find(
            item =>
              String(item.id) ===
              String(vehicleSelect.value)
          );

        if (!vehicle) {

          MyHomeGroup.setFormMessage(
            message,
            "Please select a vehicle.",
            "error"
          );

          return;
        }

        const exit =
          exitTime.value || null;

        const duration =
          MyHomeGroup.calculateDuration(
            entryTime.value,
            exit
          );

        try {

          MyHomeGroup.setButtonLoading(
            button,
            true,
            "Saving..."
          );

          await MyHomeGroup.createEntry({

            vehicle_id:
              vehicle.id,

            vehicle_number:
              vehicle.vehicle_number,

            vehicle_type:
              vehicle.vehicle_type,

            driver_name:
              document
                .getElementById(
                  "driverName"
                )
                .value
                .trim(),

            contractor:
              document
                .getElementById(
                  "contractor"
                )
                .value
                .trim(),

            entry_date:
              dateInput.value,

            entry_time:
              entryTime.value,

            exit_time:
              exit,

            duration,

            purpose:
              document
                .getElementById(
                  "purpose"
                )
                .value
                .trim(),

            notes:
              document
                .getElementById(
                  "notes"
                )
                .value
                .trim()

          });

          MyHomeGroup.showToast(
            "Vehicle entry saved.",
            "success"
          );

          setTimeout(() => {

            window.location.href =
              "/pages/dashboard.html";

          }, 700);

        } catch (error) {

          MyHomeGroup.setFormMessage(
            message,
            error.message ||
              "Unable to save entry.",
            "error"
          );

          MyHomeGroup.setButtonLoading(
            button,
            false
          );

        }

      }
    );

  await loadVehicles();

});
</script>

</body>
</html>
