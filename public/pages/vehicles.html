<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Vehicles - My Home Group</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

  <style>
    .page-wrap{
      max-width:1200px;
      margin:0 auto;
      padding:20px;
      padding-bottom:100px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      margin-bottom:20px;
    }

    .topbar h1{
      margin:0;
      font-size:26px;
    }

    .topbar p{
      margin:5px 0 0;
      opacity:.7;
      font-size:14px;
    }

    .top-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .btn{
      border:0;
      border-radius:10px;
      padding:11px 16px;
      cursor:pointer;
      font-weight:700;
      font-size:14px;
    }

    .btn-primary{
      background:#f5b400;
      color:#111;
    }

    .btn-secondary{
      background:#eef1f4;
      color:#222;
    }

    .btn-danger{
      background:#dc3545;
      color:#fff;
    }

    .btn-small{
      padding:8px 11px;
      font-size:12px;
    }

    .toolbar{
      display:grid;
      grid-template-columns:1fr 180px 150px;
      gap:10px;
      margin-bottom:18px;
    }

    .input,
    select,
    textarea{
      width:100%;
      box-sizing:border-box;
      border:1px solid #d8dde3;
      border-radius:10px;
      padding:12px;
      background:#fff;
      font-size:14px;
      outline:none;
    }

    .input:focus,
    select:focus,
    textarea:focus{
      border-color:#f5b400;
      box-shadow:0 0 0 3px rgba(245,180,0,.12);
    }

    .vehicle-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:15px;
    }

    .vehicle-card{
      background:#fff;
      border:1px solid #e3e7eb;
      border-radius:15px;
      padding:16px;
      box-shadow:0 3px 12px rgba(0,0,0,.05);
    }

    .vehicle-head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      margin-bottom:12px;
    }

    .vehicle-number{
      font-size:19px;
      font-weight:800;
      word-break:break-word;
    }

    .vehicle-type{
      margin-top:4px;
      font-size:13px;
      opacity:.7;
    }

    .status{
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      padding:5px 9px;
      font-size:11px;
      font-weight:800;
      white-space:nowrap;
    }

    .status-active{
      background:#dff7e7;
      color:#16803c;
    }

    .status-inactive{
      background:#ffe1e4;
      color:#b42332;
    }

    .vehicle-info{
      display:grid;
      gap:8px;
      margin:14px 0;
    }

    .info-row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-size:13px;
      border-bottom:1px solid #f0f1f2;
      padding-bottom:7px;
    }

    .info-label{
      opacity:.6;
    }

    .info-value{
      text-align:right;
      font-weight:600;
      word-break:break-word;
    }

    .vehicle-actions{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
    }

    .empty{
      background:#fff;
      border:1px dashed #ccd2d8;
      border-radius:15px;
      padding:40px 20px;
      text-align:center;
      opacity:.75;
    }

    .loading{
      text-align:center;
      padding:35px;
      opacity:.7;
    }

    .modal{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:9999;
    }

    .modal.show{
      display:flex;
    }

    .modal-box{
      width:min(560px,100%);
      max-height:90vh;
      overflow:auto;
      background:#fff;
      border-radius:18px;
      padding:20px;
      box-sizing:border-box;
    }

    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:18px;
    }

    .modal-head h2{
      margin:0;
      font-size:21px;
    }

    .close{
      width:36px;
      height:36px;
      border:0;
      border-radius:50%;
      background:#eef1f4;
      cursor:pointer;
      font-size:20px;
    }

    .form-group{
      margin-bottom:13px;
    }

    .form-group label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin-bottom:6px;
    }

    .form-actions{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:18px;
    }

    .history-list{
      display:grid;
      gap:10px;
    }

    .history-item{
      border:1px solid #e5e8eb;
      border-radius:11px;
      padding:12px;
    }

    .history-main{
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-weight:700;
    }

    .history-meta{
      margin-top:6px;
      font-size:12px;
      opacity:.7;
      line-height:1.6;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:25px;
      transform:translateX(-50%) translateY(100px);
      background:#16191d;
      color:#fff;
      padding:12px 18px;
      border-radius:10px;
      font-size:14px;
      z-index:10000;
      transition:.25s ease;
      max-width:90%;
      text-align:center;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
    }

    .toast.error{
      background:#c62828;
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:5000;
      display:flex;
      justify-content:space-around;
      background:#fff;
      border-top:1px solid #ddd;
      padding:8px 5px calc(8px + env(safe-area-inset-bottom));
      box-shadow:0 -3px 12px rgba(0,0,0,.06);
    }

    .bottom-nav a{
      text-decoration:none;
      color:#555;
      font-size:11px;
      text-align:center;
      padding:6px 8px;
    }

    .bottom-nav a.active{
      color:#111;
      font-weight:800;
    }

    @media(max-width:900px){
      .vehicle-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media(max-width:650px){
      .page-wrap{
        padding:15px;
        padding-bottom:95px;
      }

      .topbar{
        align-items:flex-start;
      }

      .topbar h1{
        font-size:23px;
      }

      .toolbar{
        grid-template-columns:1fr;
      }

      .vehicle-grid{
        grid-template-columns:1fr;
      }

      .top-actions .btn{
        padding:9px 11px;
      }
    }
  </style>
</head>

<body>

  <main class="page-wrap">

    <header class="topbar">
      <div>
        <h1>🚚 Vehicles</h1>
        <p>
          Manage vehicles, drivers and contractors
        </p>
      </div>

      <div class="top-actions">
        <button
          class="btn btn-secondary"
          onclick="window.location.href='dashboard.html'"
        >
          Dashboard
        </button>

        <button
          class="btn btn-primary"
          id="addVehicleBtn"
        >
          + Add Vehicle
        </button>
      </div>
    </header>


    <!-- SEARCH / FILTER -->

    <section class="toolbar">

      <input
        id="searchInput"
        class="input"
        type="search"
        placeholder="Search vehicle, driver or contractor..."
      >

      <select id="typeFilter">
        <option value="">All Types</option>
        <option value="TM / Transit Mixer">TM / Transit Mixer</option>
        <option value="Truck">Truck</option>
        <option value="Dumper">Dumper</option>
        <option value="Excavator">Excavator</option>
        <option value="JCB">JCB</option>
        <option value="Loader">Loader</option>
        <option value="Crane">Crane</option>
        <option value="Tractor">Tractor</option>
        <option value="Water Tanker">Water Tanker</option>
        <option value="Other">Other</option>
      </select>

      <select id="statusFilter">
        <option value="">All Status</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>

    </section>


    <!-- VEHICLE LIST -->

    <section id="vehicleContainer">

      <div class="loading">
        Loading vehicles...
      </div>

    </section>

  </main>


  <!-- ADD / EDIT MODAL -->

  <div
    class="modal"
    id="vehicleModal"
  >

    <div class="modal-box">

      <div class="modal-head">

        <h2 id="modalTitle">
          Add Vehicle
        </h2>

        <button
          class="close"
          id="closeModal"
          type="button"
        >
          ×
        </button>

      </div>


      <form id="vehicleForm">

        <input
          type="hidden"
          id="vehicleId"
        >


        <div class="form-group">

          <label for="vehicleNumber">
            Vehicle Number *
          </label>

          <input
            id="vehicleNumber"
            class="input"
            type="text"
            placeholder="Example: TS09AB1234"
            required
          >

        </div>


        <div class="form-group">

          <label for="vehicleType">
            Vehicle Type *
          </label>

          <select
            id="vehicleType"
            required
          >

            <option value="">
              Select vehicle type
            </option>

            <option value="TM / Transit Mixer">
              TM / Transit Mixer
            </option>

            <option value="Truck">
              Truck
            </option>

            <option value="Dumper">
              Dumper
            </option>

            <option value="Excavator">
              Excavator
            </option>

            <option value="JCB">
              JCB
            </option>

            <option value="Loader">
              Loader
            </option>

            <option value="Crane">
              Crane
            </option>

            <option value="Tractor">
              Tractor
            </option>

            <option value="Water Tanker">
              Water Tanker
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="driverName">
            Driver Name
          </label>

          <input
            id="driverName"
            class="input"
            type="text"
            placeholder="Driver name"
          >

        </div>


        <div class="form-group">

          <label for="contractor">
            Contractor / Company
          </label>

          <input
            id="contractor"
            class="input"
            type="text"
            placeholder="Contractor or company"
          >

        </div>


        <div class="form-group">

          <label for="vehicleStatus">
            Status
          </label>

          <select id="vehicleStatus">

            <option value="Active">
              Active
            </option>

            <option value="Inactive">
              Inactive
            </option>

          </select>

        </div>


        <div class="form-actions">

          <button
            type="button"
            class="btn btn-secondary"
            id="cancelBtn"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="btn btn-primary"
            id="saveBtn"
          >
            Save Vehicle
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- HISTORY MODAL -->

  <div
    class="modal"
    id="historyModal"
  >

    <div class="modal-box">

      <div class="modal-head">

        <h2 id="historyTitle">
          Vehicle History
        </h2>

        <button
          class="close"
          id="closeHistory"
          type="button"
        >
          ×
        </button>

      </div>

      <div id="historyContainer">
        Loading...
      </div>

    </div>

  </div>


  <!-- TOAST -->

  <div
    id="toast"
    class="toast"
  ></div>


  <!-- MOBILE NAV -->

  <nav class="bottom-nav">

    <a href="dashboard.html">
      🏠<br>
      Home
    </a>

    <a
      href="vehicles.html"
      class="active"
    >
      🚚<br>
      Vehicles
    </a>

    <a href="add-entry.html">
      ➕<br>
      Entry
    </a>

    <a href="calendar.html">
      📅<br>
      Calendar
    </a>

    <a href="profile.html">
      👤<br>
      You
    </a>

  </nav>


  <script src="../app.js"></script>

  <script>
    "use strict";


    /* =====================================================
       STATE
    ===================================================== */

    let vehicles = [];

    let entries = [];

    let editingVehicleId = null;


    /* =====================================================
       DOM
    ===================================================== */

    const vehicleContainer =
      document.getElementById(
        "vehicleContainer"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const typeFilter =
      document.getElementById(
        "typeFilter"
      );

    const statusFilter =
      document.getElementById(
        "statusFilter"
      );

    const vehicleModal =
      document.getElementById(
        "vehicleModal"
      );

    const historyModal =
      document.getElementById(
        "historyModal"
      );

    const vehicleForm =
      document.getElementById(
        "vehicleForm"
      );


    /* =====================================================
       TOAST
    ===================================================== */

    let toastTimer = null;


    function showToast(
      message,
      error = false
    ){

      const toast =
        document.getElementById(
          "toast"
        );

      toast.textContent =
        message;

      toast.classList.toggle(
        "error",
        error
      );

      toast.classList.add(
        "show"
      );


      clearTimeout(
        toastTimer
      );


      toastTimer =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },
          2800
        );

    }


    /* =====================================================
       LOAD DATA
    ===================================================== */

    async function loadVehicles(){

      vehicleContainer.innerHTML = `
        <div class="loading">
          Loading vehicles...
        </div>
      `;


      try{

        vehicles =
          await window.MyHomeGroup
            .getVehicles();


        try{

          entries =
            await window.MyHomeGroup
              .getEntries();

        }catch(error){

          entries = [];

        }


        renderVehicles();

      }catch(error){

        console.error(
          error
        );

        vehicleContainer.innerHTML = `
          <div class="empty">
            <h3>Unable to load vehicles</h3>
            <p>${escapeHTML(error.message)}</p>

            <button
              class="btn btn-primary"
              onclick="loadVehicles()"
            >
              Retry
            </button>
          </div>
        `;

      }

    }


    /* =====================================================
       FILTER
    ===================================================== */

    function getFilteredVehicles(){

      const search =
        searchInput
          .value
          .trim()
          .toLowerCase();

      const type =
        typeFilter.value;

      const status =
        statusFilter.value;


      return vehicles.filter(
        vehicle => {

          const searchable = [
            vehicle.vehicle_number,
            vehicle.vehicle_type,
            vehicle.driver_name,
            vehicle.contractor
          ]
          .join(" ")
          .toLowerCase();


          const matchesSearch =
            !search ||
            searchable.includes(
              search
            );


          const matchesType =
            !type ||
            vehicle.vehicle_type ===
              type;


          const matchesStatus =
            !status ||
            vehicle.status ===
              status;


          return (
            matchesSearch &&
            matchesType &&
            matchesStatus
          );

        }
      );

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderVehicles(){

      const filtered =
        getFilteredVehicles();


      if(
        filtered.length === 0
      ){

        vehicleContainer.innerHTML = `
          <div class="empty">

            <div style="font-size:42px;">
              🚚
            </div>

            <h3>
              No vehicles found
            </h3>

            <p>
              Add your first vehicle or change the filters.
            </p>

          </div>
        `;

        return;

      }


      const grid =
        document.createElement(
          "div"
        );

      grid.className =
        "vehicle-grid";


      filtered.forEach(
        vehicle => {

          grid.appendChild(
            createVehicleCard(
              vehicle
            )
          );

        }
      );


      vehicleContainer.innerHTML =
        "";

      vehicleContainer.appendChild(
        grid
      );

    }


    function createVehicleCard(
      vehicle
    ){

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "vehicle-card";


      const statusClass =
        vehicle.status === "Active"
          ? "status-active"
          : "status-inactive";


      const vehicleEntries =
        entries.filter(
          entry =>
            Number(
              entry.vehicle_id ??
              entry.vehicleId
            ) ===
            Number(
              vehicle.id
            )
        );


      const totalMinutes =
        vehicleEntries.reduce(
          (
            total,
            entry
          ) => {

            return (
              total +
              (
                Number(
                  entry.duration
                ) || 0
              )
            );

          },
          0
        );


      card.innerHTML = `

        <div class="vehicle-head">

          <div>

            <div class="vehicle-number">
              ${escapeHTML(
                vehicle.vehicle_number
              )}
            </div>

            <div class="vehicle-type">
              ${escapeHTML(
                vehicle.vehicle_type
              )}
            </div>

          </div>

          <span
            class="status ${statusClass}"
          >
            ${escapeHTML(
              vehicle.status
            )}
          </span>

        </div>


        <div class="vehicle-info">

          <div class="info-row">

            <span class="info-label">
              Driver
            </span>

            <span class="info-value">
              ${escapeHTML(
                vehicle.driver_name ||
                "Not added"
              )}
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              Contractor
            </span>

            <span class="info-value">
              ${escapeHTML(
                vehicle.contractor ||
                "Not added"
              )}
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              Entries
            </span>

            <span class="info-value">
              ${vehicleEntries.length}
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              Total Duration
            </span>

            <span class="info-value">
              ${window.MyHomeGroup
                .durationText(
                  totalMinutes
                )}
            </span>

          </div>

        </div>


        <div class="vehicle-actions">

          <button
            class="btn btn-secondary btn-small"
            data-action="history"
            data-id="${vehicle.id}"
          >
            History
          </button>

          <button
            class="btn btn-secondary btn-small"
            data-action="edit"
            data-id="${vehicle.id}"
          >
            Edit
          </button>

          <button
            class="btn btn-danger btn-small"
            data-action="delete"
            data-id="${vehicle.id}"
          >
            Delete
          </button>

        </div>
      `;


      return card;

    }


    /* =====================================================
       MODAL
    ===================================================== */

    function openAddModal(){

      editingVehicleId =
        null;


      document.getElementById(
        "modalTitle"
      ).textContent =
        "Add Vehicle";


      vehicleForm.reset();


      document.getElementById(
        "vehicleId"
      ).value =
        "";


      document.getElementById(
        "vehicleStatus"
      ).value =
        "Active";


      document.getElementById(
        "saveBtn"
      ).textContent =
        "Save Vehicle";


      vehicleModal.classList.add(
        "show"
      );

    }


    function openEditModal(
      vehicle
    ){

      editingVehicleId =
        vehicle.id;


      document.getElementById(
        "modalTitle"
      ).textContent =
        "Edit Vehicle";


      document.getElementById(
        "vehicleId"
      ).value =
        vehicle.id;


      document.getElementById(
        "vehicleNumber"
      ).value =
        vehicle.vehicle_number || "";


      document.getElementById(
        "vehicleType"
      ).value =
        vehicle.vehicle_type || "";


      document.getElementById(
        "driverName"
      ).value =
        vehicle.driver_name || "";


      document.getElementById(
        "contractor"
      ).value =
        vehicle.contractor || "";


      document.getElementById(
        "vehicleStatus"
      ).value =
        vehicle.status || "Active";


      document.getElementById(
        "saveBtn"
      ).textContent =
        "Update Vehicle";


      vehicleModal.classList.add(
        "show"
      );

    }


    function closeVehicleModal(){

      vehicleModal.classList.remove(
        "show"
      );

      editingVehicleId =
        null;

    }


    /* =====================================================
       SAVE VEHICLE
    ===================================================== */

    async function saveVehicle(
      event
    ){

      event.preventDefault();


      const vehicleNumber =
        document.getElementById(
          "vehicleNumber"
        )
        .value
        .trim()
        .toUpperCase();


      const vehicleType =
        document.getElementById(
          "vehicleType"
        )
        .value;


      const driverName =
        document.getElementById(
          "driverName"
        )
        .value
        .trim();


      const contractor =
        document.getElementById(
          "contractor"
        )
        .value
        .trim();


      const status =
        document.getElementById(
          "vehicleStatus"
        )
        .value;


      if(
        !vehicleNumber ||
        !vehicleType
      ){

        showToast(
          "Vehicle number and type are required.",
          true
        );

        return;

      }


      const saveButton =
        document.getElementById(
          "saveBtn"
        );


      saveButton.disabled =
        true;

      saveButton.textContent =
        editingVehicleId
          ? "Updating..."
          : "Saving...";


      try{

        const payload = {
          vehicleNumber,
          vehicleType,
          driverName,
          contractor,
          status
        };


        if(
          editingVehicleId
        ){

          await window.MyHomeGroup
            .updateVehicle(
              editingVehicleId,
              payload
            );


          showToast(
            "Vehicle updated successfully."
          );

        }else{

          await window.MyHomeGroup
            .createVehicle(
              payload
            );


          showToast(
            "Vehicle added successfully."
          );

        }


        closeVehicleModal();

        await loadVehicles();

      }catch(error){

        console.error(
          error
        );

        showToast(
          error.message ||
          "Unable to save vehicle.",
          true
        );

      }finally{

        saveButton.disabled =
          false;

        saveButton.textContent =
          editingVehicleId
            ? "Update Vehicle"
            : "Save Vehicle";

      }

    }


    /* =====================================================
       DELETE
    ===================================================== */

    async function deleteVehicle(
      vehicle
    ){

      const confirmed =
        window.confirm(
          `Delete vehicle ${vehicle.vehicle_number}?`
        );


      if(
        !confirmed
      ){

        return;

      }


      try{

        await window.MyHomeGroup
          .deleteVehicle(
            vehicle.id
          );


        showToast(
          "Vehicle deleted successfully."
        );


        await loadVehicles();

      }catch(error){

        console.error(
          error
        );

        showToast(
          error.message ||
          "Unable to delete vehicle.",
          true
        );

      }

    }


    /* =====================================================
       HISTORY
    ===================================================== */

    function openHistory(
      vehicle
    ){

      const container =
        document.getElementById(
          "historyContainer"
        );


      document.getElementById(
        "historyTitle"
      ).textContent =
        `${vehicle.vehicle_number} - History`;


      const vehicleEntries =
        entries
          .filter(
            entry =>
              Number(
                entry.vehicle_id ??
                entry.vehicleId
              ) ===
              Number(
                vehicle.id
              )
          )
          .sort(
            (
              a,
              b
            ) => {

              const dateA =
                `${a.entry_date || a.date || ""} ${a.entry_time || a.entryTime || ""}`;

              const dateB =
                `${b.entry_date || b.date || ""} ${b.entry_time || b.entryTime || ""}`;

              return dateB.localeCompare(
                dateA
              );

            }
          );


      if(
        vehicleEntries.length === 0
      ){

        container.innerHTML = `
          <div class="empty">
            No history available for this vehicle.
          </div>
        `;

      }else{

        const list =
          document.createElement(
            "div"
          );

        list.className =
          "history-list";


        vehicleEntries.forEach(
          entry => {

            const item =
              document.createElement(
                "div"
              );

            item.className =
              "history-item";


            const date =
              entry.entry_date ||
              entry.date ||
              "";


            const entryTime =
              entry.entry_time ||
              entry.entryTime ||
              "";


            const exitTime =
              entry.exit_time ||
              entry.exitTime ||
              "";


            const duration =
              Number(
                entry.duration
              ) || 0;


            item.innerHTML = `

              <div class="history-main">

                <span>
                  ${escapeHTML(
                    window.MyHomeGroup
                      .dateText(
                        date
                      )
                  )}
                </span>

                <span>
                  ${escapeHTML(
                    window.MyHomeGroup
                      .durationText(
                        duration
                      )
                  )}
                </span>

              </div>


              <div class="history-meta">

                Entry:
                ${escapeHTML(
                  entryTime || "-"
                )}

                &nbsp; | &nbsp;

                Exit:
                ${escapeHTML(
                  exitTime || "Running"
                )}

                <br>

                Driver:
                ${escapeHTML(
                  entry.driver_name ||
                  entry.driverName ||
                  vehicle.driver_name ||
                  "-"
                )}

                <br>

                Purpose:
                ${escapeHTML(
                  entry.purpose ||
                  "-"
                )}

              </div>
            `;


            list.appendChild(
              item
            );

          }
        );


        container.innerHTML =
          "";

        container.appendChild(
          list
        );

      }


      historyModal.classList.add(
        "show"
      );

    }


    function closeHistoryModal(){

      historyModal.classList.remove(
        "show"
      );

    }


    /* =====================================================
       EVENTS
    ===================================================== */

    document
      .getElementById(
        "addVehicleBtn"
      )
      .addEventListener(
        "click",
        openAddModal
      );


    document
      .getElementById(
        "closeModal"
      )
      .addEventListener(
        "click",
        closeVehicleModal
      );


    document
      .getElementById(
        "cancelBtn"
      )
      .addEventListener(
        "click",
        closeVehicleModal
      );


    document
      .getElementById(
        "closeHistory"
      )
      .addEventListener(
        "click",
        closeHistoryModal
      );


    vehicleForm
      .addEventListener(
        "submit",
        saveVehicle
      );


    searchInput
      .addEventListener(
        "input",
        renderVehicles
      );


    typeFilter
      .addEventListener(
        "change",
        renderVehicles
      );


    statusFilter
      .addEventListener(
        "change",
        renderVehicles
      );


    vehicleContainer
      .addEventListener(
        "click",
        event => {

          const button =
            event.target.closest(
              "[data-action]"
            );


          if(
            !button
          ){

            return;

          }


          const vehicleId =
            Number(
              button.dataset.id
            );


          const vehicle =
            vehicles.find(
              item =>
                Number(
                  item.id
                ) ===
                vehicleId
            );


          if(
            !vehicle
          ){

            return;

          }


          const action =
            button.dataset.action;


          if(
            action === "edit"
          ){

            openEditModal(
              vehicle
            );

          }


          if(
            action === "delete"
          ){

            deleteVehicle(
              vehicle
            );

          }


          if(
            action === "history"
          ){

            openHistory(
              vehicle
            );

          }

        }
      );


    vehicleModal
      .addEventListener(
        "click",
        event => {

          if(
            event.target ===
            vehicleModal
          ){

            closeVehicleModal();

          }

        }
      );


    historyModal
      .addEventListener(
        "click",
        event => {

          if(
            event.target ===
            historyModal
          ){

            closeHistoryModal();

          }

        }
      );


    /* =====================================================
       INITIAL LOAD
    ===================================================== */

    loadVehicles();

  </script>

</body>
</html>
