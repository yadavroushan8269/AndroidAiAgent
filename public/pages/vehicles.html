<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Vehicles — MY HOME GROUP</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <div class="page">

    <header class="app-header">

      <div class="app-header-inner">

        <a
          href="/dashboard"
          class="header-brand"
        >
          <div class="brand-logo">MH</div>

          <div>
            <strong>MY HOME GROUP</strong>
            <span>Vehicles</span>
          </div>
        </a>

        <div class="header-actions">

          <a
            href="/pages/notifications.html"
            class="icon-btn"
          >
            🔔
            <span
              class="notification-badge hidden"
            >
              0
            </span>
          </a>

          <a
            href="/pages/profile.html"
            class="icon-btn"
          >
            👤
          </a>

        </div>

      </div>

    </header>

    <main class="page-content">

      <div class="page-title">

        <h1>Vehicles</h1>

        <p>
          Manage your vehicle list.
        </p>

      </div>

      <section
        id="add"
        class="card"
        style="margin-bottom: 18px;"
      >

        <h2 class="card-title">
          ADD VEHICLE
        </h2>

        <form
          id="vehicleForm"
          onsubmit="event.preventDefault(); addVehicle();"
        >

          <div class="form-row">

            <div class="form-group">

              <label for="vehicleNumber">
                Vehicle Number
              </label>

              <input
                id="vehicleNumber"
                class="form-control"
                type="text"
                placeholder="AP28XX1234"
                required
              >

            </div>

            <div class="form-group">

              <label for="vehicleType">
                Vehicle Type
              </label>

              <select
                id="vehicleType"
                class="form-control"
                required
              >
                <option value="">
                  Loading...
                </option>
              </select>

            </div>

          </div>

          <div class="form-row">

            <div class="form-group">

              <label for="vehicleDriver">
                Driver
              </label>

              <input
                id="vehicleDriver"
                class="form-control"
                type="text"
                placeholder="Driver Name"
              >

            </div>

            <div class="form-group">

              <label for="vehicleContractor">
                Contractor
              </label>

              <input
                id="vehicleContractor"
                class="form-control"
                type="text"
                placeholder="Contractor"
              >

            </div>

          </div>

          <button
            class="btn btn-primary"
            type="submit"
          >
            + Add Vehicle
          </button>

        </form>

      </section>

      <section>

        <div
          id="vehicleList"
          class="vehicle-grid"
        >
          <div class="loading">
            Loading vehicles...
          </div>
        </div>

      </section>

    </main>

    <nav class="bottom-nav">

      <div class="bottom-nav-inner">

        <a href="/dashboard">
          <span>🏠</span>
          <span>Home</span>
        </a>

        <a
          href="/pages/vehicles.html"
          class="active"
        >
          <span>🚚</span>
          <span>Vehicles</span>
        </a>

        <a
          href="/pages/add-entry.html"
          class="entry-button"
        >
          <span>＋</span>
          <span>Entry</span>
        </a>

        <a href="/pages/calendar.html">
          <span>📅</span>
          <span>Calendar</span>
        </a>

        <a href="/pages/profile.html">
          <span>👤</span>
          <span>You</span>
        </a>

      </div>

    </nav>

  </div>

  <script src="/app.js"></script>

</body>
</html>
