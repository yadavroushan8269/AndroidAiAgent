<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - My Home Group</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    body {
      margin: 0;
      background: #f5f7fa;
      color: #1f2937;
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }

    .topbar {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 24px;
    }

    .title-wrap p {
      margin: 5px 0 0;
      color: #6b7280;
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: #f59e0b;
      color: #fff;
    }

    .btn-light {
      background: #eef2f7;
      color: #374151;
    }

    .btn-danger {
      background: #ef4444;
      color: #fff;
    }

    .summary {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .summary-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .summary-number {
      display: block;
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .summary-label {
      color: #6b7280;
      font-size: 13px;
    }

    #notificationsList {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .notification {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
      border-left: 4px solid #d1d5db;
      position: relative;
    }

    .notification.unread {
      border-left-color: #f59e0b;
      background: #fffdf5;
    }

    .notification-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .notification-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 5px;
    }

    .notification-message {
      margin: 0;
      color: #4b5563;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .notification-time {
      color: #9ca3af;
      font-size: 12px;
      white-space: nowrap;
    }

    .notification-type {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: #4b5563;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .notification-buttons {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .empty {
      background: #fff;
      border-radius: 16px;
      padding: 50px 20px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .empty h3 {
      margin: 0 0 6px;
    }

    .empty p {
      margin: 0;
      color: #6b7280;
    }

    .loading {
      background: #fff;
      border-radius: 16px;
      padding: 35px;
      text-align: center;
      color: #6b7280;
    }

    .error-box {
      background: #fee2e2;
      color: #991b1b;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .badge {
      display: inline-flex;
      min-width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 0 5px;
      vertical-align: middle;
    }

    @media (max-width: 600px) {
      .page {
        padding: 12px 12px 90px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }

      .summary {
        grid-template-columns: 1fr 1fr;
      }

      .summary-box:last-child {
        grid-column: span 2;
      }

      .notification-header {
        flex-direction: column;
        gap: 5px;
      }
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 -3px 12px rgba(0,0,0,.08);
    }

    .bottom-nav a {
      text-decoration: none;
      color: #6b7280;
      font-size: 11px;
      text-align: center;
      min-width: 60px;
    }

    .bottom-nav a.active {
      color: #f59e0b;
      font-weight: 700;
    }

    .nav-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 2px;
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="topbar">
      <div class="title-wrap">
        <h1>🔔 Notifications</h1>
        <p>Your latest alerts and updates</p>
      </div>

      <div class="actions">
        <button class="btn-light" id="markAllBtn">
          Mark All Read
        </button>

        <button class="btn-danger" id="clearAllBtn">
          Clear All
        </button>
      </div>
    </section>

    <div class="error-box" id="errorBox"></div>

    <section class="summary">
      <div class="summary-box">
        <span class="summary-number" id="totalCount">0</span>
        <span class="summary-label">Total</span>
      </div>

      <div class="summary-box">
        <span class="summary-number" id="unreadCount">0</span>
        <span class="summary-label">Unread</span>
      </div>

      <div class="summary-box">
        <span class="summary-number" id="readCount">0</span>
        <span class="summary-label">Read</span>
      </div>
    </section>

    <section id="notificationsContainer">
      <div class="loading">
        Loading notifications...
      </div>
    </section>

  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html">
      <span class="nav-icon">🏠</span>
      Home
    </a>

    <a href="vehicles.html">
      <span class="nav-icon">🚚</span>
      Vehicles
    </a>

    <a href="add-entry.html">
      <span class="nav-icon">➕</span>
      Entry
    </a>

    <a href="calendar.html">
      <span class="nav-icon">📅</span>
      Calendar
    </a>

    <a href="profile.html">
      <span class="nav-icon">👤</span>
      You
    </a>
  </nav>

  <script src="../app.js"></script>

  <script>
    let notifications = [];

    const container = document.getElementById("notificationsContainer");
    const errorBox = document.getElementById("errorBox");

    const totalCount = document.getElementById("totalCount");
    const unreadCount = document.getElementById("unreadCount");
    const readCount = document.getElementById("readCount");

    const markAllBtn = document.getElementById("markAllBtn");
    const clearAllBtn = document.getElementById("clearAllBtn");

    function showError(message) {
      errorBox.textContent = message || "Something went wrong.";
      errorBox.style.display = "block";
    }

    function hideError() {
      errorBox.style.display = "none";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDateTime(value) {
      if (!value) return "";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return String(value);
      }

      return date.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderSummary() {
      const total = notifications.length;

      const unread = notifications.filter(
        item => !item.is_read
      ).length;

      const read = total - unread;

      totalCount.textContent = total;
      unreadCount.textContent = unread;
      readCount.textContent = read;
    }

    function renderNotifications() {
      renderSummary();

      if (!notifications.length) {
        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🔔</div>
            <h3>No notifications</h3>
            <p>You're all caught up.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = notifications.map(notification => {
        const unreadClass = notification.is_read ? "" : "unread";

        const readButton = notification.is_read
          ? ""
          : `
            <button
              class="btn-primary"
              onclick="markRead(${Number(notification.id)})"
            >
              Mark as Read
            </button>
          `;

        return `
          <article class="notification ${unreadClass}">
            <div class="notification-header">

              <div>
                <h3 class="notification-title">
                  ${escapeHtml(notification.title || "Notification")}
                </h3>

                <p class="notification-message">
                  ${escapeHtml(notification.message || "")}
                </p>
              </div>

              <span class="notification-time">
                ${escapeHtml(formatDateTime(notification.created_at))}
              </span>

            </div>

            <span class="notification-type">
              ${escapeHtml(notification.type || "general")}
            </span>

            <div class="notification-buttons">
              ${readButton}

              <button
                class="btn-light"
                onclick="deleteOne(${Number(notification.id)})"
              >
                Delete
              </button>
            </div>
          </article>
        `;
      }).join("");
    }

    async function loadNotifications() {
      hideError();

      container.innerHTML = `
        <div class="loading">
          Loading notifications...
        </div>
      `;

      try {
        notifications = await MyHomeGroup.getNotifications();

        if (!Array.isArray(notifications)) {
          notifications = [];
        }

        renderNotifications();

        if (typeof MyHomeGroup.updateNotificationBadges === "function") {
          await MyHomeGroup.updateNotificationBadges();
        }

      } catch (error) {
        console.error("Notifications load error:", error);

        notifications = [];
        renderSummary();

        container.innerHTML = `
          <div class="empty">
            <div class="empty-icon">⚠️</div>
            <h3>Unable to load notifications</h3>
            <p>Please refresh the page and try again.</p>
          </div>
        `;

        showError(error.message || "Failed to load notifications.");
      }
    }

    async function markRead(id) {
      try {
        await MyHomeGroup.markNotificationRead(id);
        await loadNotifications();

      } catch (error) {
        console.error("Mark notification read error:", error);
        showError(error.message || "Failed to mark notification as read.");
      }
    }

    async function markAllRead() {
      if (!notifications.some(item => !item.is_read)) {
        return;
      }

      try {
        markAllBtn.disabled = true;
        markAllBtn.textContent = "Marking...";

        await MyHomeGroup.markAllNotificationsRead();

        await loadNotifications();

      } catch (error) {
        console.error("Mark all read error:", error);
        showError(error.message || "Failed to mark all notifications as read.");

      } finally {
        markAllBtn.disabled = false;
        markAllBtn.textContent = "Mark All Read";
      }
    }

    async function deleteOne(id) {
      try {
        await MyHomeGroup.deleteNotification(id);
        await loadNotifications();

      } catch (error) {
        console.error("Delete notification error:", error);
        showError(error.message || "Failed to delete notification.");
      }
    }

    async function clearAll() {
      if (!notifications.length) {
        return;
      }

      const confirmed = confirm(
        "Are you sure you want to delete all notifications?"
      );

      if (!confirmed) {
        return;
      }

      try {
        clearAllBtn.disabled = true;
        clearAllBtn.textContent = "Clearing...";

        await MyHomeGroup.clearNotifications();

        await loadNotifications();

      } catch (error) {
        console.error("Clear notifications error:", error);
        showError(error.message || "Failed to clear notifications.");

      } finally {
        clearAllBtn.disabled = false;
        clearAllBtn.textContent = "Clear All";
      }
    }

    markAllBtn.addEventListener("click", markAllRead);
    clearAllBtn.addEventListener("click", clearAll);

    document.addEventListener("DOMContentLoaded", () => {
      loadNotifications();
    });
  </script>

</body>
</html>
