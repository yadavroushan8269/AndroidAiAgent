<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Notifications — MY HOME GROUP</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <div class="page">

    <header class="app-header">

      <div class="app-header-inner">

        <a
          href="/dashboard"
          class="header-brand"
        >
          <div class="brand-logo">MH</div>

          <div>
            <strong>MY HOME GROUP</strong>
            <span>Notifications</span>
          </div>
        </a>

        <div class="header-actions">

          <a
            href="/pages/profile.html"
            class="icon-btn"
          >
            👤
          </a>

        </div>

      </div>

    </header>

    <main class="page-content">

      <div
        style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:12px;
          margin-bottom:18px;
          flex-wrap:wrap;
        "
      >

        <div class="page-title" style="margin:0;">

          <h1>NOTIFICATIONS</h1>

          <p>
            Your latest notifications.
          </p>

        </div>

        <div
          style="
            display:flex;
            gap:8px;
            flex-wrap:wrap;
          "
        >

          <button
            class="btn btn-secondary"
            type="button"
            onclick="markAllNotificationsRead()"
          >
            Mark All Read
          </button>

          <button
            class="btn btn-danger"
            type="button"
            onclick="clearAllNotifications()"
          >
            Clear All
          </button>

        </div>

      </div>

      <section
        id="notificationList"
        class="notification-list"
      >

        <div class="loading">
          Loading notifications...
        </div>

      </section>

    </main>

    <nav class="bottom-nav">

      <div class="bottom-nav-inner">

        <a href="/dashboard">
          <span>🏠</span>
          <span>Home</span>
        </a>

        <a href="/pages/vehicles.html">
          <span>🚚</span>
          <span>Vehicles</span>
        </a>

        <a
          href="/pages/add-entry.html"
          class="entry-button"
        >
          <span>＋</span>
          <span>Entry</span>
        </a>

        <a href="/pages/calendar.html">
          <span>📅</span>
          <span>Calendar</span>
        </a>

        <a href="/pages/profile.html">
          <span>👤</span>
          <span>You</span>
        </a>

      </div>

    </nav>

  </div>

  <script src="/app.js"></script>

</body>
</html>
