<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Notifications - My Home Group</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

</head>

<body>

<header class="app-header">

  <div class="app-header-inner">

    <a
      href="/pages/dashboard.html"
      class="app-brand"
    >

      <div class="app-brand-mark">
        MH
      </div>

      <div class="app-brand-text">

        <div class="app-brand-name">
          My Home Group
        </div>

        <div class="app-brand-subtitle">
          Vehicle Duration Management
        </div>

      </div>

    </a>

    <div class="header-actions">

      <a
        href="/pages/notifications.html"
        class="header-icon-btn"
      >
        🔔
        <span
          class="notification-badge hidden"
          data-notification-count
        ></span>
      </a>

      <a
        href="/pages/profile.html"
        class="header-icon-btn"
      >
        👤
      </a>

    </div>

  </div>

</header>

<div class="app-layout">

  <aside class="sidebar">

    <nav class="sidebar-nav">

      <a
        href="/pages/dashboard.html"
        class="nav-link"
      >
        <span class="nav-icon">🏠</span>
        Dashboard
      </a>

      <a
        href="/pages/vehicles.html"
        class="nav-link"
      >
        <span class="nav-icon">🚛</span>
        Vehicles
      </a>

      <a
        href="/pages/add-entry.html"
        class="nav-link"
      >
        <span class="nav-icon">➕</span>
        Add Entry
      </a>

      <a
        href="/pages/calendar.html"
        class="nav-link"
      >
        <span class="nav-icon">📅</span>
        Calendar
      </a>

      <a
        href="/pages/reports.html"
        class="nav-link"
      >
        <span class="nav-icon">📊</span>
        Reports
      </a>

      <a
        href="/pages/notifications.html"
        class="nav-link active"
      >
        <span class="nav-icon">🔔</span>
        Notifications
      </a>

      <a
        href="/pages/profile.html"
        class="nav-link"
      >
        <span class="nav-icon">👤</span>
        Profile
      </a>

      <a
        href="#"
        class="nav-link logout-btn"
      >
        <span class="nav-icon">🚪</span>
        Logout
      </a>

    </nav>

  </aside>

  <main class="main-content">

    <div class="content-inner">

      <div class="page-heading">

        <div class="page-heading-text">

          <h1>
            Notifications
          </h1>

          <p>
            Your account notifications
          </p>

        </div>

        <div
          class="page-heading-actions"
          style="
            display:flex;
            gap:8px;
            flex-wrap:wrap;
          "
        >

          <button
            id="markAll"
            class="btn btn-secondary"
          >
            Mark All Read
          </button>

          <button
            id="clearAll"
            class="btn btn-danger"
          >
            Clear All
          </button>

        </div>

      </div>

      <section class="card">

        <div
          id="notificationList"
          class="notification-list"
        >

          <div class="loading">
            Loading notifications...
          </div>

        </div>

      </section>

    </div>

  </main>

</div>

<nav class="mobile-bottom-nav">

  <div class="mobile-nav-inner">

    <a
      href="/pages/dashboard.html"
      class="mobile-nav-item"
    >
      <span class="mobile-nav-icon">🏠</span>
      Home
    </a>

    <a
      href="/pages/vehicles.html"
      class="mobile-nav-item"
    >
      <span class="mobile-nav-icon">🚛</span>
      Vehicles
    </a>

    <a
      href="/pages/add-entry.html"
      class="mobile-nav-item add"
    >
      <span class="mobile-nav-add">+</span>
      Entry
    </a>

    <a
      href="/pages/calendar.html"
      class="mobile-nav-item"
    >
      <span class="mobile-nav-icon">📅</span>
      Calendar
    </a>

    <a
      href="/pages/profile.html"
      class="mobile-nav-item"
    >
      <span class="mobile-nav-icon">👤</span>
      You
    </a>

  </div>

</nav>

<script src="../app.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const list =
    document.getElementById(
      "notificationList"
    );

  async function load() {

    try {

      const notifications =
        await MyHomeGroup
          .getNotifications();

      if (!notifications.length) {

        list.innerHTML = `
          <div class="empty-state">

            <div class="empty-icon">
              🔔
            </div>

            <div class="empty-title">
              No notifications
            </div>

            <div class="empty-text">
              You're all caught up.
            </div>

          </div>
        `;

        return;

      }

      list.innerHTML =
        notifications.map(
          notification => {

            const unread =
              !notification.is_read;

            return `
              <div
                class="
                  notification-item
                  ${unread ? "unread" : ""}
                "
                data-id="${notification.id}"
              >

                <div class="notification-icon">
                  ${
                    notification.type === "error"
                      ? "⚠️"
                      : notification.type === "success"
                        ? "✅"
                        : "🔔"
                  }
                </div>

                <div class="notification-content">

                  <div class="notification-title">
                    ${MyHomeGroup.escapeHtml(
                      notification.title ||
                      "Notification"
                    )}
                  </div>

                  <div class="notification-message">
                    ${MyHomeGroup.escapeHtml(
                      notification.message ||
                      ""
                    )}
                  </div>

                  <div class="notification-time">
                    ${
                      notification.created_at
                        ? new Date(
                            notification.created_at
                          ).toLocaleString()
                        : ""
                    }
                  </div>

                </div>

                <div
                  style="
                    display:flex;
                    flex-direction:column;
                    gap:5px;
                  "
                >

                  ${
                    unread
                      ? `
                        <button
                          class="btn btn-sm btn-secondary read-btn"
                          data-id="${notification.id}"
                        >
                          Read
                        </button>
                      `
                      : ""
                  }

                  <button
                    class="btn btn-sm btn-outline delete-btn"
                    data-id="${notification.id}"
                  >
                    Delete
                  </button>

                </div>

              </div>
            `;

          }
        ).join("");

      document
        .querySelectorAll(".read-btn")
        .forEach(button => {

          button.addEventListener(
            "click",
            async () => {

              try {

                await MyHomeGroup
                  .markNotificationRead(
                    button.dataset.id
                  );

                await load();

                MyHomeGroup
                  .updateNotificationBadge();

              } catch (error) {

                MyHomeGroup.showToast(
                  error.message,
                  "error"
                );

              }

            }
          );

        });

      document
        .querySelectorAll(".delete-btn")
        .forEach(button => {

          button.addEventListener(
            "click",
            async () => {

              try {

                await MyHomeGroup
                  .deleteNotification(
                    button.dataset.id
                  );

                await load();

                MyHomeGroup
                  .updateNotificationBadge();

              } catch (error) {

                MyHomeGroup.showToast(
                  error.message,
                  "error"
                );

              }

            }
          );

        });

    } catch (error) {

      list.innerHTML = `
        <div class="empty-state">

          <div class="empty-icon">
            ⚠️
          </div>

          <div class="empty-title">
            Unable to load notifications
          </div>

          <div class="empty-text">
            ${MyHomeGroup.escapeHtml(
              error.message
            )}
          </div>

        </div>
      `;

    }

  }

  document
    .getElementById("markAll")
    .addEventListener(
      "click",
      async () => {

        try {

          await MyHomeGroup
            .markAllNotificationsRead();

          await load();

          MyHomeGroup
            .updateNotificationBadge();

          MyHomeGroup.showToast(
            "All notifications marked as read.",
            "success"
          );

        } catch (error) {

          MyHomeGroup.showToast(
            error.message,
            "error"
          );

        }

      }
    );

  document
    .getElementById("clearAll")
    .addEventListener(
      "click",
      async () => {

        if (
          !confirm(
            "Clear all notifications?"
          )
        ) {
          return;
        }

        try {

          await MyHomeGroup
            .clearNotifications();

          await load();

          MyHomeGroup
            .updateNotificationBadge();

          MyHomeGroup.showToast(
            "Notifications cleared.",
            "success"
          );

        } catch (error) {

          MyHomeGroup.showToast(
            error.message,
            "error"
          );

        }

      }
    );

  await load();

});
</script>

</body>
</html>
