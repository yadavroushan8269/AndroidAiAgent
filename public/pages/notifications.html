<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Notifications - My Home Group</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

  <style>
    .page-wrap{
      max-width:900px;
      margin:0 auto;
      padding:20px;
      padding-bottom:105px;
    }

    .page-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:20px;
    }

    .page-header h1{
      margin:0;
      font-size:26px;
    }

    .page-header p{
      margin:5px 0 0;
      font-size:13px;
      opacity:.65;
    }

    .back-btn{
      border:0;
      background:#eef1f4;
      border-radius:10px;
      padding:10px 13px;
      cursor:pointer;
      font-weight:700;
    }

    .notification-card{
      background:#fff;
      border:1px solid #e3e7eb;
      border-radius:16px;
      padding:18px;
      box-shadow:0 3px 12px rgba(0,0,0,.04);
    }

    .toolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:15px;
      flex-wrap:wrap;
    }

    .toolbar-left{
      font-size:13px;
      opacity:.7;
    }

    .toolbar-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .toolbar-actions button{
      border:1px solid #ddd;
      background:#fff;
      border-radius:9px;
      padding:8px 11px;
      cursor:pointer;
      font-size:12px;
      font-weight:700;
    }

    .toolbar-actions button:hover{
      background:#f7f7f7;
    }

    .notification-list{
      display:grid;
      gap:9px;
    }

    .notification-item{
      display:flex;
      gap:12px;
      align-items:flex-start;
      border:1px solid #edf0f2;
      border-radius:12px;
      padding:13px;
      transition:.15s ease;
    }

    .notification-item.unread{
      background:#fff9df;
      border-color:#f0d46d;
    }

    .notification-icon{
      width:40px;
      height:40px;
      flex:none;
      border-radius:11px;
      background:#eef1f4;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:19px;
    }

    .notification-content{
      flex:1;
      min-width:0;
    }

    .notification-title{
      font-size:14px;
      font-weight:800;
    }

    .notification-message{
      margin-top:4px;
      font-size:12px;
      line-height:1.6;
      opacity:.75;
    }

    .notification-time{
      margin-top:5px;
      font-size:10px;
      opacity:.5;
    }

    .notification-actions{
      display:flex;
      gap:5px;
      flex:none;
    }

    .small-btn{
      border:0;
      background:#eef1f4;
      border-radius:8px;
      padding:7px;
      cursor:pointer;
      font-size:11px;
    }

    .empty{
      text-align:center;
      padding:45px 15px;
      opacity:.65;
    }

    .empty-icon{
      font-size:42px;
      margin-bottom:10px;
    }

    .loading{
      text-align:center;
      padding:30px;
      opacity:.65;
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:5000;
      display:flex;
      justify-content:space-around;
      background:#fff;
      border-top:1px solid #ddd;
      padding:8px 5px calc(8px + env(safe-area-inset-bottom));
      box-shadow:0 -3px 12px rgba(0,0,0,.06);
    }

    .bottom-nav a{
      text-decoration:none;
      color:#555;
      font-size:11px;
      text-align:center;
      padding:6px 8px;
    }

    .bottom-nav a.active{
      color:#111;
      font-weight:800;
    }

    @media(max-width:600px){
      .page-wrap{
        padding:15px;
        padding-bottom:100px;
      }

      .page-header h1{
        font-size:22px;
      }

      .notification-item{
        padding:11px;
      }

      .notification-actions{
        flex-direction:column;
      }
    }
  </style>
</head>

<body>

  <main class="page-wrap">

    <!-- HEADER -->

    <header class="page-header">

      <div>
        <h1>🔔 Notifications</h1>
        <p>Important updates and activity</p>
      </div>

      <button
        class="back-btn"
        type="button"
        onclick="window.location.href='dashboard.html'"
      >
        ← Dashboard
      </button>

    </header>


    <!-- NOTIFICATIONS -->

    <section class="notification-card">

      <div class="toolbar">

        <div
          id="notificationSummary"
          class="toolbar-left"
        >
          Loading notifications...
        </div>


        <div class="toolbar-actions">

          <button
            id="markAllButton"
            type="button"
          >
            ✓ Mark All Read
          </button>

          <button
            id="clearButton"
            type="button"
          >
            Clear All
          </button>

        </div>

      </div>


      <div
        id="notificationList"
        class="notification-list"
      >

        <div class="loading">
          Loading...
        </div>

      </div>

    </section>

  </main>


  <!-- MOBILE NAV -->

  <nav class="bottom-nav">

    <a href="dashboard.html">
      🏠<br>
      Home
    </a>

    <a href="vehicles.html">
      🚚<br>
      Vehicles
    </a>

    <a href="add-entry.html">
      ➕<br>
      Entry
    </a>

    <a href="calendar.html">
      📅<br>
      Calendar
    </a>

    <a
      href="profile.html"
      class="active"
    >
      👤<br>
      You
    </a>

  </nav>


  <script src="../app.js"></script>


  <script>
    "use strict";


    let notifications = [];


    /* =====================================================
       HELPERS
    ===================================================== */

    function escapeHTML(value){

      const div =
        document.createElement("div");

      div.textContent =
        value == null
          ? ""
          : String(value);

      return div.innerHTML;

    }


    function getNotifications(){

      /*
        app.js stores notifications locally
        for now. This page uses the central
        MyHomeGroup notification functions.
      */

      if(
        typeof window.MyHomeGroup
          .getNotifications ===
        "function"
      ){

        return (
          window.MyHomeGroup
            .getNotifications() || []
        );

      }


      try{

        return JSON.parse(
          localStorage.getItem(
            "hyma_notifications"
          ) || "[]"
        );

      }catch(error){

        return [];

      }

    }


    function saveNotifications(){

      if(
        typeof window.MyHomeGroup
          .saveNotifications ===
        "function"
      ){

        window.MyHomeGroup
          .saveNotifications(
            notifications
          );

        return;

      }


      localStorage.setItem(
        "hyma_notifications",
        JSON.stringify(
          notifications
        )
      );

    }


    function getId(
      notification,
      index
    ){

      return (
        notification.id ||
        notification._id ||
        index
      );

    }


    function isRead(
      notification
    ){

      return (
        notification.read === true ||
        notification.isRead === true
      );

    }


    function getTitle(
      notification
    ){

      return (
        notification.title ||
        notification.heading ||
        "Notification"
      );

    }


    function getMessage(
      notification
    ){

      return (
        notification.message ||
        notification.body ||
        notification.text ||
        ""
      );

    }


    function getTime(
      notification
    ){

      return (
        notification.createdAt ||
        notification.created_at ||
        notification.time ||
        notification.date ||
        ""
      );

    }


    function getIcon(
      notification
    ){

      const type =
        String(
          notification.type ||
          ""
        ).toLowerCase();


      if(
        type.includes("vehicle")
      ){

        return "🚚";

      }


      if(
        type.includes("entry")
      ){

        return "📋";

      }


      if(
        type.includes("warning")
      ){

        return "⚠️";

      }


      if(
        type.includes("success")
      ){

        return "✅";

      }


      return "🔔";

    }


    function formatTime(
      value
    ){

      if(
        !value
      ){

        return "";

      }


      const date =
        new Date(
          value
        );


      if(
        Number.isNaN(
          date.getTime()
        )
      ){

        return String(
          value
        );

      }


      return date.toLocaleString(
        "en-IN",
        {
          day:"numeric",
          month:"short",
          year:"numeric",
          hour:"2-digit",
          minute:"2-digit"
        }
      );

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderNotifications(){

      const list =
        document.getElementById(
          "notificationList"
        );


      const unread =
        notifications.filter(
          notification =>
            !isRead(
              notification
            )
        ).length;


      document.getElementById(
        "notificationSummary"
      ).textContent =
        notifications.length === 0
          ? "No notifications"
          : `${notifications.length} notification${
              notifications.length === 1
                ? ""
                : "s"
            } · ${unread} unread`;


      if(
        notifications.length === 0
      ){

        list.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              🔕
            </div>

            <div>
              You're all caught up.
            </div>

          </div>

        `;

        return;

      }


      list.innerHTML =
        "";


      notifications.forEach(
        (
          notification,
          index
        ) => {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "notification-item" +
            (
              isRead(
                notification
              )
                ? ""
                : " unread"
            );


          const id =
            getId(
              notification,
              index
            );


          item.innerHTML = `

            <div class="notification-icon">
              ${getIcon(
                notification
              )}
            </div>


            <div class="notification-content">

              <div class="notification-title">

                ${escapeHTML(
                  getTitle(
                    notification
                  )
                )}

              </div>


              <div class="notification-message">

                ${escapeHTML(
                  getMessage(
                    notification
                  )
                )}

              </div>


              <div class="notification-time">

                ${escapeHTML(
                  formatTime(
                    getTime(
                      notification
                    )
                  )
                )}

              </div>

            </div>


            <div class="notification-actions">

              ${
                !isRead(
                  notification
                )
                  ? `
                    <button
                      class="small-btn"
                      type="button"
                      onclick="markOneRead('${escapeHTML(
                        id
                      )}')"
                    >
                      ✓
                    </button>
                  `
                  : ""
              }


              <button
                class="small-btn"
                type="button"
                onclick="deleteOne('${escapeHTML(
                  id
                )}')"
              >
                🗑️
              </button>

            </div>

          `;


          list.appendChild(
            item
          );

        }
      );

    }


    /* =====================================================
       MARK ONE READ
    ===================================================== */

    function markOneRead(
      id
    ){

      notifications =
        notifications.map(
          (
            notification,
            index
          ) => {

            const notificationId =
              String(
                getId(
                  notification,
                  index
                )
              );


            if(
              notificationId ===
              String(id)
            ){

              return {
                ...notification,
                read:true,
                isRead:true
              };

            }


            return notification;

          }
        );


      saveNotifications();

      renderNotifications();

    }


    /* =====================================================
       MARK ALL
    ===================================================== */

    document
      .getElementById(
        "markAllButton"
      )
      .addEventListener(
        "click",
        () => {

          notifications =
            notifications.map(
              notification => ({
                ...notification,
                read:true,
                isRead:true
              })
            );


          saveNotifications();

          renderNotifications();

        }
      );


    /* =====================================================
       DELETE ONE
    ===================================================== */

    function deleteOne(
      id
    ){

      notifications =
        notifications.filter(
          (
            notification,
            index
          ) => {

            return String(
              getId(
                notification,
                index
              )
            ) !==
            String(id);

          }
        );


      saveNotifications();

      renderNotifications();

    }


    /* =====================================================
       CLEAR ALL
    ===================================================== */

    document
      .getElementById(
        "clearButton"
      )
      .addEventListener(
        "click",
        () => {

          if(
            notifications.length === 0
          ){

            return;

          }


          const confirmed =
            confirm(
              "Clear all notifications?"
            );


          if(
            !confirmed
          ){

            return;

          }


          notifications = [];

          saveNotifications();

          renderNotifications();

        }
      );


    /* =====================================================
       INIT
    ===================================================== */

    notifications =
      getNotifications();


    renderNotifications();

  </script>

</body>
</html>
