<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reports - My Home Group</title>

  <link rel="stylesheet" href="../style.css">

  <style>
    .page-wrap{
      max-width:1200px;
      margin:0 auto;
      padding:20px;
      padding-bottom:105px;
    }

    .page-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:20px;
    }

    .page-header h1{
      margin:0;
      font-size:26px;
    }

    .page-header p{
      margin:5px 0 0;
      font-size:13px;
      opacity:.65;
    }

    .back-btn{
      border:0;
      background:#eef1f4;
      border-radius:10px;
      padding:10px 13px;
      cursor:pointer;
      font-weight:700;
    }

    .filter-card,
    .summary-card,
    .report-card{
      background:#fff;
      border:1px solid #e3e7eb;
      border-radius:16px;
      padding:18px;
      margin-bottom:18px;
      box-shadow:0 3px 12px rgba(0,0,0,.04);
    }

    .filter-grid{
      display:grid;
      grid-template-columns:1fr 1fr 1fr 1fr;
      gap:12px;
      align-items:end;
    }

    .field label{
      display:block;
      font-size:12px;
      font-weight:700;
      margin-bottom:6px;
    }

    .field input,
    .field select{
      width:100%;
      box-sizing:border-box;
      padding:11px;
      border:1px solid #d8dde2;
      border-radius:10px;
      background:#fff;
    }

    .filter-actions{
      display:flex;
      gap:8px;
      margin-top:14px;
      flex-wrap:wrap;
    }

    .filter-actions button{
      cursor:pointer;
    }

    .preset-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:15px;
    }

    .preset-btn{
      border:1px solid #ddd;
      background:#fff;
      border-radius:9px;
      padding:8px 12px;
      cursor:pointer;
      font-size:12px;
      font-weight:700;
    }

    .preset-btn.active{
      background:#fff4cc;
      border-color:#e7bd3b;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
    }

    .summary-item{
      border:1px solid #edf0f2;
      border-radius:12px;
      padding:14px;
    }

    .summary-label{
      font-size:11px;
      opacity:.65;
    }

    .summary-value{
      font-size:23px;
      font-weight:800;
      margin-top:4px;
    }

    .report-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
    }

    .report-head h2{
      margin:0;
      font-size:18px;
    }

    .table-wrap{
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:650px;
    }

    th,
    td{
      padding:11px 10px;
      border-bottom:1px solid #edf0f2;
      text-align:left;
      font-size:13px;
    }

    th{
      font-size:11px;
      opacity:.65;
      text-transform:uppercase;
    }

    td strong{
      font-weight:800;
    }

    .empty{
      text-align:center;
      padding:35px 15px;
      opacity:.65;
    }

    .loading{
      text-align:center;
      padding:30px;
      opacity:.65;
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:5000;
      display:flex;
      justify-content:space-around;
      background:#fff;
      border-top:1px solid #ddd;
      padding:8px 5px calc(8px + env(safe-area-inset-bottom));
      box-shadow:0 -3px 12px rgba(0,0,0,.06);
    }

    .bottom-nav a{
      text-decoration:none;
      color:#555;
      font-size:11px;
      text-align:center;
      padding:6px 8px;
    }

    .bottom-nav a.active{
      color:#111;
      font-weight:800;
    }

    @media(max-width:900px){
      .filter-grid{
        grid-template-columns:1fr 1fr;
      }

      .summary-grid{
        grid-template-columns:1fr 1fr;
      }
    }

    @media(max-width:600px){
      .page-wrap{
        padding:15px;
        padding-bottom:100px;
      }

      .page-header h1{
        font-size:22px;
      }

      .filter-grid{
        grid-template-columns:1fr;
      }

      .summary-grid{
        grid-template-columns:1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="page-wrap">

    <!-- HEADER -->

    <header class="page-header">

      <div>
        <h1>📊 Reports</h1>
        <p>Analyze vehicle duration and activity</p>
      </div>

      <button
        class="back-btn"
        type="button"
        onclick="window.location.href='dashboard.html'"
      >
        ← Dashboard
      </button>

    </header>


    <!-- FILTER -->

    <section class="filter-card">

      <div class="preset-row">

        <button
          class="preset-btn active"
          data-preset="today"
        >
          Today
        </button>

        <button
          class="preset-btn"
          data-preset="week"
        >
          This Week
        </button>

        <button
          class="preset-btn"
          data-preset="month"
        >
          This Month
        </button>

        <button
          class="preset-btn"
          data-preset="custom"
        >
          Custom
        </button>

      </div>


      <div class="filter-grid">

        <div class="field">

          <label for="fromDate">
            From Date
          </label>

          <input
            id="fromDate"
            type="date"
          >

        </div>


        <div class="field">

          <label for="toDate">
            To Date
          </label>

          <input
            id="toDate"
            type="date"
          >

        </div>


        <div class="field">

          <label for="vehicleFilter">
            Vehicle
          </label>

          <select id="vehicleFilter">

            <option value="">
              All Vehicles
            </option>

          </select>

        </div>


        <div class="field">

          <label for="typeFilter">
            Vehicle Type
          </label>

          <select id="typeFilter">

            <option value="">
              All Types
            </option>

          </select>

        </div>

      </div>


      <div class="filter-grid" style="margin-top:12px;">

        <div class="field">

          <label for="driverFilter">
            Driver
          </label>

          <select id="driverFilter">

            <option value="">
              All Drivers
            </option>

          </select>

        </div>


        <div class="field">

          <label for="contractorFilter">
            Contractor
          </label>

          <select id="contractorFilter">

            <option value="">
              All Contractors
            </option>

          </select>

        </div>

      </div>


      <div class="filter-actions">

        <button
          id="applyButton"
          class="btn btn-primary"
          type="button"
        >
          Apply Report
        </button>

        <button
          id="resetButton"
          class="btn"
          type="button"
        >
          Reset
        </button>

      </div>

    </section>


    <!-- SUMMARY -->

    <section class="summary-card">

      <div class="summary-grid">

        <div class="summary-item">

          <div class="summary-label">
            Entries
          </div>

          <div
            id="summaryEntries"
            class="summary-value"
          >
            0
          </div>

        </div>


        <div class="summary-item">

          <div class="summary-label">
            Vehicles
          </div>

          <div
            id="summaryVehicles"
            class="summary-value"
          >
            0
          </div>

        </div>


        <div class="summary-item">

          <div class="summary-label">
            Running
          </div>

          <div
            id="summaryRunning"
            class="summary-value"
          >
            0
          </div>

        </div>


        <div class="summary-item">

          <div class="summary-label">
            Total Duration
          </div>

          <div
            id="summaryDuration"
            class="summary-value"
          >
            0 min
          </div>

        </div>

      </div>

    </section>


    <!-- VEHICLE REPORT -->

    <section class="report-card">

      <div class="report-head">

        <h2>
          🚚 Vehicle-wise Report
        </h2>

      </div>


      <div
        id="vehicleReport"
        class="loading"
      >
        Loading...
      </div>

    </section>


    <!-- DRIVER REPORT -->

    <section class="report-card">

      <div class="report-head">

        <h2>
          👤 Driver-wise Report
        </h2>

      </div>


      <div
        id="driverReport"
        class="loading"
      >
        Loading...
      </div>

    </section>


    <!-- CONTRACTOR REPORT -->

    <section class="report-card">

      <div class="report-head">

        <h2>
          🏗️ Contractor-wise Report
        </h2>

      </div>


      <div
        id="contractorReport"
        class="loading"
      >
        Loading...
      </div>

    </section>


    <!-- DAILY REPORT -->

    <section class="report-card">

      <div class="report-head">

        <h2>
          📅 Daily Summary
        </h2>

      </div>


      <div
        id="dailyReport"
        class="loading"
      >
        Loading...
      </div>

    </section>

  </main>


  <!-- MOBILE NAV -->

  <nav class="bottom-nav">

    <a href="dashboard.html">
      🏠<br>
      Home
    </a>

    <a href="vehicles.html">
      🚚<br>
      Vehicles
    </a>

    <a href="add-entry.html">
      ➕<br>
      Entry
    </a>

    <a href="calendar.html">
      📅<br>
      Calendar
    </a>

    <a
      href="profile.html"
      class="active"
    >
      👤<br>
      You
    </a>

  </nav>


  <script src="../app.js"></script>


  <script>
    "use strict";


    let allEntries = [];
    let currentPreset = "today";


    /* =====================================================
       HELPERS
    ===================================================== */

    function escapeHTML(value){

      const div =
        document.createElement("div");

      div.textContent =
        value == null
          ? ""
          : String(value);

      return div.innerHTML;

    }


    function getDate(entry){

      return (
        entry.entry_date ||
        entry.entryDate ||
        entry.date ||
        ""
      );

    }


    function getVehicle(entry){

      return (
        entry.vehicle_number ||
        entry.vehicleNumber ||
        "Unknown"
      );

    }


    function getType(entry){

      return (
        entry.vehicle_type ||
        entry.vehicleType ||
        "Other"
      );

    }


    function getDriver(entry){

      return (
        entry.driver_name ||
        entry.driverName ||
        "Unknown"
      );

    }


    function getContractor(entry){

      return (
        entry.contractor ||
        "Unknown"
      );

    }


    function getDuration(entry){

      return Number(
        entry.duration
      ) || 0;

    }


    function getExit(entry){

      return (
        entry.exit_time ||
        entry.exitTime ||
        ""
      );

    }


    /* =====================================================
       DATE HELPERS
    ===================================================== */

    function formatDateLocal(date){

      const year =
        date.getFullYear();

      const month =
        String(
          date.getMonth() + 1
        ).padStart(
          2,
          "0"
        );

      const day =
        String(
          date.getDate()
        ).padStart(
          2,
          "0"
        );

      return `${year}-${month}-${day}`;

    }


    function getMonday(date){

      const d =
        new Date(date);

      const day =
        d.getDay();


      const diff =
        day === 0
          ? -6
          : 1 - day;


      d.setDate(
        d.getDate() + diff
      );


      return d;

    }


    function setPreset(
      preset
    ){

      const today =
        new Date();


      let from =
        new Date(
          today
        );

      let to =
        new Date(
          today
        );


      if(
        preset === "week"
      ){

        from =
          getMonday(
            today
          );

      }


      if(
        preset === "month"
      ){

        from =
          new Date(
            today.getFullYear(),
            today.getMonth(),
            1
          );

      }


      document.getElementById(
        "fromDate"
      ).value =
        formatDateLocal(
          from
        );


      document.getElementById(
        "toDate"
      ).value =
        formatDateLocal(
          to
        );


      currentPreset =
        preset;


      document
        .querySelectorAll(
          ".preset-btn"
        )
        .forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.preset ===
              preset
            );

          }
        );

    }


    /* =====================================================
       LOAD DATABASE
    ===================================================== */

    async function loadData(){

      try{

        allEntries =
          await window.MyHomeGroup
            .getEntries();


        allEntries =
          allEntries || [];


        populateFilters();

        setPreset(
          "today"
        );

        generateReport();

      }catch(error){

        console.error(
          "Reports:",
          error
        );


        document.getElementById(
          "vehicleReport"
        ).innerHTML =
          `<div class="empty">
             Unable to load report.
             <br>
             ${escapeHTML(
               error.message
             )}
           </div>`;

      }

    }


    /* =====================================================
       FILTER OPTIONS
    ===================================================== */

    function addOptions(
      elementId,
      values
    ){

      const select =
        document.getElementById(
          elementId
        );


      const unique =
        [...new Set(
          values.filter(
            value =>
              value &&
              value !== "-"
          )
        )]
        .sort();


      unique.forEach(
        value => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            value;

          option.textContent =
            value;

          select.appendChild(
            option
          );

        }
      );

    }


    function populateFilters(){

      addOptions(
        "vehicleFilter",
        allEntries.map(
          getVehicle
        )
      );


      addOptions(
        "typeFilter",
        allEntries.map(
          getType
        )
      );


      addOptions(
        "driverFilter",
        allEntries.map(
          getDriver
        )
      );


      addOptions(
        "contractorFilter",
        allEntries.map(
          getContractor
        )
      );

    }


    /* =====================================================
       GET FILTERED DATA
    ===================================================== */

    function getFilteredEntries(){

      const from =
        document.getElementById(
          "fromDate"
        ).value;


      const to =
        document.getElementById(
          "toDate"
        ).value;


      const vehicle =
        document.getElementById(
          "vehicleFilter"
        ).value;


      const type =
        document.getElementById(
          "typeFilter"
        ).value;


      const driver =
        document.getElementById(
          "driverFilter"
        ).value;


      const contractor =
        document.getElementById(
          "contractorFilter"
        ).value;


      return allEntries.filter(
        entry => {

          const date =
            getDate(
              entry
            );


          if(
            from &&
            date < from
          ){

            return false;

          }


          if(
            to &&
            date > to
          ){

            return false;

          }


          if(
            vehicle &&
            getVehicle(entry) !==
            vehicle
          ){

            return false;

          }


          if(
            type &&
            getType(entry) !==
            type
          ){

            return false;

          }


          if(
            driver &&
            getDriver(entry) !==
            driver
          ){

            return false;

          }


          if(
            contractor &&
            getContractor(entry) !==
            contractor
          ){

            return false;

          }


          return true;

        }
      );

    }


    /* =====================================================
       SUMMARY
    ===================================================== */

    function updateSummary(
      entries
    ){

      const vehicles =
        new Set(
          entries.map(
            getVehicle
          )
        );


      const running =
        entries.filter(
          entry =>
            !getExit(entry)
        ).length;


      const duration =
        entries.reduce(
          (
            total,
            entry
          ) => {

            return (
              total +
              getDuration(
                entry
              )
            );

          },
          0
        );


      document.getElementById(
        "summaryEntries"
      ).textContent =
        entries.length;


      document.getElementById(
        "summaryVehicles"
      ).textContent =
        vehicles.size;


      document.getElementById(
        "summaryRunning"
      ).textContent =
        running;


      document.getElementById(
        "summaryDuration"
      ).textContent =
        window.MyHomeGroup
          .durationText(
            duration
          );

    }


    /* =====================================================
       GROUP DATA
    ===================================================== */

    function groupBy(
      entries,
      getter
    ){

      const map =
        new Map();


      entries.forEach(
        entry => {

          const key =
            getter(entry);


          if(
            !map.has(key)
          ){

            map.set(
              key,
              {
                name:key,
                entries:0,
                duration:0
              }
            );

          }


          const item =
            map.get(
              key
            );


          item.entries++;

          item.duration +=
            getDuration(
              entry
            );

        }
      );


      return [
        ...map.values()
      ].sort(
        (
          a,
          b
        ) =>
          b.duration -
          a.duration
      );

    }


    /* =====================================================
       TABLE RENDER
    ===================================================== */

    function renderGroupTable(
      containerId,
      rows,
      firstHeader
    ){

      const container =
        document.getElementById(
          containerId
        );


      if(
        rows.length === 0
      ){

        container.innerHTML = `
          <div class="empty">
            No data found for selected filters.
          </div>
        `;

        return;

      }


      let html = `

        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>
                  ${firstHeader}
                </th>

                <th>
                  Entries
                </th>

                <th>
                  Total Duration
                </th>

              </tr>

            </thead>

            <tbody>

      `;


      rows.forEach(
        row => {

          html += `

            <tr>

              <td>
                <strong>
                  ${escapeHTML(
                    row.name
                  )}
                </strong>
              </td>

              <td>
                ${row.entries}
              </td>

              <td>
                ${window.MyHomeGroup
                  .durationText(
                    row.duration
                  )}
              </td>

            </tr>

          `;

        }
      );


      html += `

            </tbody>

          </table>

        </div>

      `;


      container.innerHTML =
        html;

    }


    /* =====================================================
       DAILY REPORT
    ===================================================== */

    function renderDailyReport(
      entries
    ){

      const groups =
        groupBy(
          entries,
          entry =>
            getDate(
              entry
            )
        );


      const container =
        document.getElementById(
          "dailyReport"
        );


      if(
        groups.length === 0
      ){

        container.innerHTML = `
          <div class="empty">
            No daily data found.
          </div>
        `;

        return;

      }


      let html = `

        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>Date</th>
                <th>Entries</th>
                <th>Duration</th>

              </tr>

            </thead>

            <tbody>

      `;


      groups
        .sort(
          (
            a,
            b
          ) =>
            b.name.localeCompare(
              a.name
            )
        )
        .forEach(
          row => {

            html += `

              <tr>

                <td>
                  <strong>
                    ${escapeHTML(
                      row.name
                    )}
                  </strong>
                </td>

                <td>
                  ${row.entries}
                </td>

                <td>
                  ${window.MyHomeGroup
                    .durationText(
                      row.duration
                    )}
                </td>

              </tr>

            `;

          }
        );


      html += `
            </tbody>
          </table>
        </div>
      `;


      container.innerHTML =
        html;

    }


    /* =====================================================
       GENERATE REPORT
    ===================================================== */

    function generateReport(){

      const entries =
        getFilteredEntries();


      updateSummary(
        entries
      );


      renderGroupTable(
        "vehicleReport",
        groupBy(
          entries,
          getVehicle
        ),
        "Vehicle"
      );


      renderGroupTable(
        "driverReport",
        groupBy(
          entries,
          getDriver
        ),
        "Driver"
      );


      renderGroupTable(
        "contractorReport",
        groupBy(
          entries,
          getContractor
        ),
        "Contractor"
      );


      renderDailyReport(
        entries
      );

    }


    /* =====================================================
       PRESET BUTTONS
    ===================================================== */

    document
      .querySelectorAll(
        ".preset-btn"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              const preset =
                button.dataset.preset;


              if(
                preset === "custom"
              ){

                currentPreset =
                  "custom";


                document
                  .querySelectorAll(
                    ".preset-btn"
                  )
                  .forEach(
                    item => {

                      item.classList.toggle(
                        "active",
                        item ===
                        button
                      );

                    }
                  );

                return;

              }


              setPreset(
                preset
              );


              generateReport();

            }
          );

        }
      );


    /* =====================================================
       APPLY
    ===================================================== */

    document
      .getElementById(
        "applyButton"
      )
      .addEventListener(
        "click",
        generateReport
      );


    /* =====================================================
       RESET
    ===================================================== */

    document
      .getElementById(
        "resetButton"
      )
      .addEventListener(
        "click",
        () => {

          document.getElementById(
            "vehicleFilter"
          ).value = "";

          document.getElementById(
            "typeFilter"
          ).value = "";

          document.getElementById(
            "driverFilter"
          ).value = "";

          document.getElementById(
            "contractorFilter"
          ).value = "";


          setPreset(
            "today"
          );


          generateReport();

        }
      );


    /* =====================================================
       INIT
    ===================================================== */

    loadData();

  </script>

</body>
</html>
