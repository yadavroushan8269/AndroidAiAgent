<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5a400">
  <meta
    name="description"
    content="Hyma RMC Kokapet Vehicle Reports"
  >
  <title>Reports - Hyma RMC Kokapet</title>

  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <div class="app-page">

    <header class="top-header">

      <div>
        <h1>Reports</h1>
        <p>Vehicle duration reports</p>
      </div>

      <button
        id="reportTodayBtn"
        class="header-action"
        type="button"
      >
        Today
      </button>

    </header>

    <main class="page-content">

      <!-- Report Filters -->

      <section class="report-card">

        <h2>Report Period</h2>

        <p>
          Select the period you want to analyse.
        </p>

        <div class="report-filters">

          <div>
            <label for="reportFrom">
              From
            </label>

            <input
              id="reportFrom"
              type="date"
            >
          </div>

          <div>
            <label for="reportTo">
              To
            </label>

            <input
              id="reportTo"
              type="date"
            >
          </div>

        </div>

      </section>

      <!-- Report Summary -->

      <section class="stats-grid">

        <div class="stat-card">
          <strong id="reportVehicleCount">0</strong>
          <span>Vehicles</span>
        </div>

        <div class="stat-card orange">
          <strong id="reportEntryCount">0</strong>
          <span>Total Entries</span>
        </div>

        <div class="stat-card green">
          <strong id="reportCompletedCount">0</strong>
          <span>Completed</span>
        </div>

        <div class="stat-card blue">
          <strong id="reportDuration">0h 0m</strong>
          <span>Total Duration</span>
        </div>

      </section>

      <!-- Vehicle Report -->

      <section class="report-card">

        <div class="section-heading">

          <div>
            <h2>Vehicle-wise Report</h2>

            <p>
              Duration recorded for each vehicle.
            </p>
          </div>

        </div>

        <div
          id="vehicleReportList"
          class="activity-list"
        ></div>

      </section>

      <!-- Entry Report -->

      <section class="report-card">

        <div class="section-heading">

          <div>
            <h2>Entries</h2>

            <p>
              Detailed entries for selected period.
            </p>
          </div>

        </div>

        <div
          id="reportEntryList"
          class="activity-list"
        ></div>

      </section>

      <div
        id="reportMessage"
        class="form-message"
      ></div>

    </main>

    <!-- Bottom Navigation -->

    <nav class="bottom-nav">

      <button
        class="nav-item"
        data-page="dashboard"
        type="button"
      >
        <span>⌂</span>
        <small>Home</small>
      </button>

      <button
        class="nav-item"
        data-page="vehicles"
        type="button"
      >
        <span>🚚</span>
        <small>Vehicles</small>
      </button>

      <button
        class="nav-item add-nav"
        data-page="add-entry"
        type="button"
      >
        <span>+</span>
      </button>

      <button
        class="nav-item"
        data-page="calendar"
        type="button"
      >
        <span>▣</span>
        <small>Calendar</small>
      </button>

      <button
        class="nav-item"
        data-page="profile"
        type="button"
      >
        <span>👤</span>
        <small>You</small>
      </button>

    </nav>

  </div>

  <script src="../app.js"></script>

</body>
</html>
