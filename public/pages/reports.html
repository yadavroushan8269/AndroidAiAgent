<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Reports - Hyma RMC Kokapet</title>

  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <div class="reports-page">

    <!-- Header -->
    <header class="dashboard-header">

      <div>
        <p class="header-small">Hyma RMC Kokapet</p>
        <h1>Reports</h1>
      </div>

      <button
        type="button"
        id="exportReportBtn"
        class="header-add-btn"
      >
        Export
      </button>

    </header>

    <!-- Report Type -->
    <section class="report-tabs">

      <button
        type="button"
        class="report-tab active"
        data-report="daily"
      >
        Daily
      </button>

      <button
        type="button"
        class="report-tab"
        data-report="weekly"
      >
        Weekly
      </button>

      <button
        type="button"
        class="report-tab"
        data-report="monthly"
      >
        Monthly
      </button>

    </section>

    <!-- Date Range -->
    <section class="report-filter-card">

      <div class="form-row">

        <div class="form-group">

          <label for="reportFrom">
            From
          </label>

          <input
            type="date"
            id="reportFrom"
            required
          >

        </div>

        <div class="form-group">

          <label for="reportTo">
            To
          </label>

          <input
            type="date"
            id="reportTo"
            required
          >

        </div>

      </div>

      <div class="form-group">

        <label for="reportVehicle">
          Vehicle
        </label>

        <select id="reportVehicle">

          <option value="all">
            All Vehicles
          </option>

        </select>

      </div>

      <div class="form-group">

        <label for="reportType">
          Vehicle Type
        </label>

        <select id="reportType">

          <option value="all">
            All Types
          </option>

          <option value="tm">
            TM / Transit Mixer
          </option>

          <option value="truck">
            Truck
          </option>

          <option value="dumper">
            Dumper
          </option>

          <option value="excavator">
            Excavator
          </option>

          <option value="jcb">
            JCB
          </option>

          <option value="loader">
            Loader
          </option>

          <option value="crane">
            Crane
          </option>

          <option value="tractor">
            Tractor
          </option>

          <option value="water-tanker">
            Water Tanker
          </option>

          <option value="other">
            Other
          </option>

        </select>

      </div>

      <button
        type="button"
        id="generateReportBtn"
        class="primary-btn"
      >
        Generate Report
      </button>

    </section>

    <!-- Report Summary -->
    <section class="report-summary">

      <div class="report-stat">

        <span>🚚</span>

        <div>
          <small>Vehicles</small>
          <strong id="reportVehicleCount">0</strong>
        </div>

      </div>

      <div class="report-stat">

        <span>📋</span>

        <div>
          <small>Entries</small>
          <strong id="reportEntryCount">0</strong>
        </div>

      </div>

      <div class="report-stat">

        <span>⏱️</span>

        <div>
          <small>Total Duration</small>
          <strong id="reportDuration">0h 0m</strong>
        </div>

      </div>

    </section>

    <!-- Report Table -->
    <section class="report-results">

      <div class="section-heading">

        <div>
          <h2>Report Details</h2>
          <p>Vehicle duration records</p>
        </div>

      </div>

      <div class="table-wrapper">

        <table>

          <thead>

            <tr>
              <th>Date</th>
              <th>Vehicle</th>
              <th>Type</th>
              <th>Driver</th>
              <th>Entry</th>
              <th>Exit</th>
              <th>Duration</th>
            </tr>

          </thead>

          <tbody id="reportTableBody">

            <tr>

              <td colspan="7">

                <div class="empty-state">

                  <div class="empty-icon">📊</div>

                  <h3>No report data</h3>

                  <p>
                    Generate a report to see vehicle records.
                  </p>

                </div>

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </section>

  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">

    <button
      type="button"
      class="nav-item"
      data-page="dashboard"
    >
      <span>🏠</span>
      <small>Home</small>
    </button>

    <button
      type="button"
      class="nav-item"
      data-page="vehicles"
    >
      <span>🚚</span>
      <small>Vehicles</small>
    </button>

    <button
      type="button"
      class="nav-item add-nav"
      data-page="add-entry"
    >
      <span>+</span>
    </button>

    <button
      type="button"
      class="nav-item"
      data-page="calendar"
    >
      <span>📅</span>
      <small>Calendar</small>
    </button>

    <button
      type="button"
      class="nav-item active"
      data-page="reports"
    >
      <span>📊</span>
      <small>Reports</small>
    </button>

    <button
      type="button"
      class="nav-item"
      data-page="profile"
    >
      <span>👤</span>
      <small>You</small>
    </button>

  </nav>

  <script src="../app.js"></script>

</body>
</html>
