<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Account — MY HOME GROUP</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="auth-brand">
        <div class="brand-logo">MH</div>

        <h1>MY HOME GROUP</h1>

        <p>
          Vehicle Duration Management
        </p>
      </div>

      <h2>Create Account</h2>

      <form id="registerForm">

        <div class="form-group">
          <label for="registerName">
            Full Name
          </label>

          <input
            id="registerName"
            class="form-control"
            type="text"
            placeholder="Full Name"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerMobile">
            Mobile
          </label>

          <input
            id="registerMobile"
            class="form-control"
            type="tel"
            placeholder="Mobile"
            autocomplete="tel"
          >
        </div>

        <div class="form-group">
          <label for="registerEmail">
            Email
          </label>

          <input
            id="registerEmail"
            class="form-control"
            type="email"
            placeholder="Email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerPassword">
            Password
          </label>

          <input
            id="registerPassword"
            class="form-control"
            type="password"
            placeholder="Password"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <div class="form-group">
          <label for="registerCompany">
            Company / Site
          </label>

          <input
            id="registerCompany"
            class="form-control"
            type="text"
            placeholder="Company / Site"
          >
        </div>

        <div class="form-actions">

          <button
            id="registerButton"
            class="btn btn-primary"
            type="submit"
          >
            Create Account
          </button>

        </div>

      </form>

      <div class="auth-links">
        Already have account?
        <a href="/login">
          Login
        </a>
      </div>

    </section>

  </main>

  <script src="/app.js"></script>

</body>
</html>
