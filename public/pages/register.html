<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Register - My Home Group</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

<div class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">MH</div>

    <h1 class="auth-title">
      Create Account
    </h1>

    <p class="auth-subtitle">
      Register for My Home Group
    </p>

    <div id="registerMessage"></div>

    <form id="registerForm" class="auth-form">

      <div class="form-group">
        <label class="form-label">
          Full Name
        </label>

        <input
          id="name"
          type="text"
          class="form-control"
          placeholder="Enter your full name"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label">
          Email
        </label>

        <input
          id="email"
          type="email"
          class="form-control"
          placeholder="Enter email address"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label">
          Mobile
        </label>

        <input
          id="mobile"
          type="tel"
          class="form-control"
          placeholder="Enter mobile number"
        >
      </div>

      <div class="form-group">
        <label class="form-label">
          Company / Site
        </label>

        <input
          id="company"
          type="text"
          class="form-control"
          placeholder="Enter company or site"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label">
          Password
        </label>

        <input
          id="password"
          type="password"
          class="form-control"
          placeholder="Minimum 6 characters"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label">
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          class="form-control"
          placeholder="Confirm password"
          autocomplete="new-password"
          required
        >
      </div>

      <button
        id="registerButton"
        type="submit"
        class="btn btn-primary btn-block"
      >
        Create Account
      </button>

    </form>

    <div class="auth-bottom">

      Already have an account?

      <a href="/pages/login.html">
        Login
      </a>

    </div>

  </div>

</div>

<script src="../app.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const form =
    document.getElementById("registerForm");

  const button =
    document.getElementById("registerButton");

  const message =
    document.getElementById("registerMessage");

  form.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();

      message.innerHTML = "";

      const name =
        document.getElementById("name")
          .value.trim();

      const email =
        document.getElementById("email")
          .value.trim();

      const mobile =
        document.getElementById("mobile")
          .value.trim();

      const company =
        document.getElementById("company")
          .value.trim();

      const password =
        document.getElementById("password")
          .value;

      const confirmPassword =
        document.getElementById("confirmPassword")
          .value;

      if (
        password.length < 6
      ) {

        MyHomeGroup.setFormMessage(
          message,
          "Password must contain at least 6 characters.",
          "error"
        );

        return;
      }

      if (
        password !== confirmPassword
      ) {

        MyHomeGroup.setFormMessage(
          message,
          "Passwords do not match.",
          "error"
        );

        return;
      }

      try {

        MyHomeGroup.setButtonLoading(
          button,
          true,
          "Creating account..."
        );

        const result =
          await MyHomeGroup.registerUser({
            name,
            email,
            mobile,
            company,
            password
          });

        if (result.token) {

          window.location.href =
            "/pages/dashboard.html";

          return;
        }

        MyHomeGroup.setFormMessage(
          message,
          "Account created. Please login.",
          "success"
        );

        setTimeout(() => {
          window.location.href =
            "/pages/login.html";
        }, 1000);

      } catch (error) {

        MyHomeGroup.setFormMessage(
          message,
          error.message ||
            "Registration failed.",
          "error"
        );

        MyHomeGroup.setButtonLoading(
          button,
          false
        );
      }

    }
  );

});
</script>

</body>
</html>
