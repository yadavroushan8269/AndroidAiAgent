<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f5a400"
  >

  <title>Register - Hyma RMC Kokapet</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="auth-logo">
        🚧
      </div>

      <h1>
        Create Account
      </h1>

      <p class="auth-subtitle">
        Register for vehicle management
      </p>


      <form
        id="registerForm"
        class="auth-form"
        novalidate
      >


        <!-- NAME -->

        <label for="registerName">
          Full Name
        </label>

        <input
          id="registerName"
          name="name"
          type="text"
          placeholder="Enter your name"
          autocomplete="name"
        >


        <!-- EMAIL -->

        <label for="registerEmail">
          Email
        </label>

        <input
          id="registerEmail"
          name="email"
          type="email"
          placeholder="Enter email"
          autocomplete="email"
        >


        <!-- MOBILE -->

        <label for="registerMobile">
          Mobile
        </label>

        <input
          id="registerMobile"
          name="mobile"
          type="tel"
          placeholder="Enter mobile number"
          autocomplete="tel"
        >


        <!-- COMPANY -->

        <label for="registerCompany">
          Company / Site
        </label>

        <input
          id="registerCompany"
          name="company"
          type="text"
          placeholder="Hyma RMC Kokapet"
        >


        <!-- ROLE -->

        <label for="registerRole">
          Role
        </label>

        <select
          id="registerRole"
          name="role"
        >
          <option value="">
            Select role
          </option>

          <option value="Security Guard">
            Security Guard
          </option>

          <option value="Admin">
            Admin
          </option>
        </select>


        <!-- PASSWORD -->

        <label for="registerPassword">
          Password
        </label>

        <input
          id="registerPassword"
          name="password"
          type="password"
          placeholder="Create password"
          autocomplete="new-password"
        >


        <!-- CONFIRM PASSWORD -->

        <label for="registerConfirmPassword">
          Confirm Password
        </label>

        <input
          id="registerConfirmPassword"
          name="confirmPassword"
          type="password"
          placeholder="Confirm password"
          autocomplete="new-password"
        >


        <!-- MESSAGE -->

        <div
          id="registerMessage"
          class="form-message"
        ></div>


        <!-- SUBMIT -->

        <button
          class="primary-btn full-width"
          type="submit"
        >
          Create Account
        </button>

      </form>


      <!-- LOGIN -->

      <div class="auth-footer">

        Already have an account?

        <a href="/pages/login.html">
          Login
        </a>

      </div>

    </section>

  </main>


  <script src="../app.js"></script>

</body>

</html>
