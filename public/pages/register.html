<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5a400">
  <title>Register - Hyma RMC Kokapet</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="auth-logo">🚧</div>

      <h1>Create Account</h1>

      <p class="auth-subtitle">
        Register for vehicle management
      </p>

      <form id="registerForm" class="auth-form">

        <label for="registerName">
          Full Name
        </label>

        <input
          id="registerName"
          type="text"
          placeholder="Enter your name"
          autocomplete="name"
          required
        >

        <label for="registerEmail">
          Email
        </label>

        <input
          id="registerEmail"
          type="email"
          placeholder="Enter email"
          autocomplete="email"
          required
        >

        <label for="registerMobile">
          Mobile
        </label>

        <input
          id="registerMobile"
          type="tel"
          placeholder="Enter mobile number"
          autocomplete="tel"
          required
        >

        <label for="registerCompany">
          Company / Site
        </label>

        <input
          id="registerCompany"
          type="text"
          placeholder="Hyma RMC Kokapet"
          required
        >

        <label for="registerRole">
          Role
        </label>

        <select id="registerRole" required>
          <option value="Security Guard">
            Security Guard
          </option>
          <option value="Admin">
            Admin
          </option>
        </select>

        <label for="registerPassword">
          Password
        </label>

        <input
          id="registerPassword"
          type="password"
          placeholder="Create password"
          autocomplete="new-password"
          required
        >

        <label for="registerConfirmPassword">
          Confirm Password
        </label>

        <input
          id="registerConfirmPassword"
          type="password"
          placeholder="Confirm password"
          autocomplete="new-password"
          required
        >

        <div
          id="registerMessage"
          class="form-message"
        ></div>

        <button
          class="primary-btn full-width"
          type="submit"
        >
          Create Account
        </button>

      </form>

      <div class="auth-footer">

        Already have an account?

        <a href="/pages/login.html">
          Login
        </a>

      </div>

    </section>

  </main>

  <script src="../app.js"></script>

</body>
</html>
