<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dashboard — MY HOME GROUP</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>
    :root { color-scheme: dark; --cyber-green:#39ff14; --cyber-dim:#0a1b12; --cyber-black:#030705; }
    body, .page { background:var(--cyber-black)!important; color:#d8ffe0!important; }
    .app-header, .app-header-inner, .bottom-nav, .page-content { background:#050b08!important; }
    .app-header, .card, .stat-card, .greeting, .quick-actions, .personal-result {
      border-color:rgba(57,255,20,.28)!important; box-shadow:0 0 14px rgba(57,255,20,.06), inset 0 0 12px rgba(57,255,20,.025);
    }
    .card, .stat-card, .greeting, .personal-result { background:#08120d!important; }
    h1,h2,h3,.card-title,.header-brand strong,label,.stat-value { color:#d8ffe0!important; }
    .brand-logo, .btn-primary, .entry-button { background:var(--cyber-green)!important; color:#031006!important; border-color:var(--cyber-green)!important; }
    .btn-secondary, .icon-btn, .quick-action { background:#0b1910!important; color:#baffb1!important; border-color:rgba(57,255,20,.3)!important; }
    .form-control, input, textarea, select { background:#030906!important; color:#c8ffc4!important; border:1px solid rgba(57,255,20,.42)!important; caret-color:var(--cyber-green); }
    input:focus,textarea:focus,select:focus { outline:2px solid rgba(57,255,20,.5)!important; box-shadow:0 0 12px rgba(57,255,20,.22)!important; }
    .btn-primary:hover, .quick-action:hover { box-shadow:0 0 16px rgba(57,255,20,.28)!important; }
    a, .bottom-nav a { color:#a8ff9e!important; }
    .stat-value.primary,.stat-value.success { color:var(--cyber-green)!important; }
    ::selection { background:var(--cyber-green); color:#001800; }
  </style>

</head>

<body>

  <div
    id="dashboardPage"
    class="page"
  >

    <header class="app-header">

      <div class="app-header-inner">

        <a
          href="/dashboard"
          class="header-brand"
        >
          <div class="brand-logo">MH</div>

          <div>
            <strong>MY HOME GROUP</strong>
            <span>Vehicle Duration Management</span>
          </div>
        </a>

        <div class="header-actions">

          <a
            href="/pages/notifications.html"
            class="icon-btn"
            aria-label="Notifications"
          >
            🔔

            <span
              class="notification-badge hidden"
            >
              0
            </span>
          </a>

          <a
            href="/pages/profile.html"
            class="icon-btn"
            aria-label="Profile"
          >
            👤
          </a>

        </div>

      </div>

    </header>

    <main class="page-content">

      <section class="greeting">

        <h1>
          Good Morning,
          <span data-user-name>
            User
          </span>
        </h1>

        <p id="dashboardDate">
          08 October 2026
        </p>

      </section>

      <section class="stats-grid">

        <div class="stat-card">
          <div class="stat-label">
            Vehicles
          </div>

          <div
            id="totalVehicles"
            class="stat-value primary"
          >
            0
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-label">
            Running
          </div>

          <div
            id="runningVehicles"
            class="stat-value success"
          >
            0
          </div>
        </div>

        <div class="stat-card">
          <div class="stat-label">
            Total Vehicle Duration
          </div>

          <div
            id="totalVehicleDuration"
            class="stat-value"
          >
            0h 0m
          </div>
        </div>
        
         <h2 class="card-title">
            PERSONAL DURATION
          </h2>

          <div class="form-group">

            <label>In Time</label>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <input
                id="personalInHour"
                class="form-control"
                type="text"
                inputmode="numeric"
                min="0"
                max="23"
                step="1"
                placeholder="HH"
                aria-label="In Time Hours"
                autocomplete="off"
              >
              <input
                id="personalInMinute"
                class="form-control"
                type="text"
                inputmode="numeric"
                min="0"
                max="59"
                step="1"
                placeholder="MM"
                aria-label="In Time Minutes"
                autocomplete="off"
              >
            </div>

          </div>

          <div class="form-group">

            <label>Out Time</label>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <input
                id="personalOutHour"
                class="form-control"
                type="text"
                inputmode="numeric"
                min="0"
                max="23"
                step="1"
                placeholder="HH"
                aria-label="Out Time Hours"
                autocomplete="off"
              >
              <input
                id="personalOutMinute"
                class="form-control"
                type="text"
                inputmode="numeric"
                min="0"
                max="59"
                step="1"
                placeholder="MM"
                aria-label="Out Time Minutes"
                autocomplete="off"
              >
            </div>

          </div>

          <div class="personal-result">

            <span>Duration</span>

            <strong id="personalResult">
              0h 0m
            </strong>

          </div>

          <div
            class="form-row"
            style="margin-top: 12px;"
          >

            <button
              id="calculatePersonal"
              class="btn btn-primary"
              type="button"
            >
              Calculate
            </button>

            <button
              id="resetPersonal"
              class="btn btn-secondary"
              type="button"
            >
              Reset
            </button>

          </div>

        </div>

      </section>

      <section class="card" style="margin-top: 16px;">

        <h2 class="card-title">
          TODAY'S ACTIVITY
        </h2>

        <div
          id="todayActivity"
          class="activity-list"
        >
          <div class="loading">
            Loading...
          </div>
        </div>

      </section>

    </main>

    <nav class="bottom-nav">

      <div class="bottom-nav-inner">

        <a
          href="/dashboard"
          class="active"
        >
          <span>🏠</span>
          <span>Home</span>
        </a>

        <a href="/pages/vehicles.html">
          <span>🚚</span>
          <span>Vehicles</span>
        </a>

        <a
          href="/pages/add-entry.html"
          class="entry-button"
        >
          <span>＋</span>
          <span>Entry</span>
        </a>

        <a href="/pages/calendar.html">
          <span>📅</span>
          <span>Calendar</span>
        </a>

        <a href="/pages/profile.html">
          <span>👤</span>
          <span>You</span>
        </a>

      </div>

    </nav>

  </div>

  <script src="/app.js"></script>

</body>
</html>
