<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f5a400"
  >

  <title>Dashboard - Hyma RMC Kokapet</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >
</head>

<body>

  <div class="app-page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="top-header">

      <div>

        <h1 id="dashboardTitle">
          Dashboard
        </h1>

        <p id="dashboardDate">
          Today
        </p>

      </div>


      <button
        id="notificationBtn"
        class="header-action notification-badge"
        type="button"
      >
        🔔
      </button>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="page-content">


      <!-- WELCOME -->

      <section class="dashboard-welcome">

        <h2 id="welcomeName">
          Welcome
        </h2>

        <p>
          Vehicle duration management
        </p>

      </section>


      <!-- STATS -->

      <section class="stats-grid">


        <div class="stat-card">

          <strong id="dashboardVehicleCount">
            0
          </strong>

          <span>
            Vehicles
          </span>

        </div>


        <div class="stat-card green">

          <strong id="dashboardRunningCount">
            0
          </strong>

          <span>
            Running
          </span>

        </div>


        <div class="stat-card orange">

          <strong id="dashboardEntryCount">
            0
          </strong>

          <span>
            Today's Entries
          </span>

        </div>


        <div class="stat-card blue">

          <strong id="dashboardDuration">
            0h 0m
          </strong>

          <span>
            Total Duration
          </span>

        </div>


      </section>


      <!-- =====================================================
           PERSONAL DURATION CALCULATOR
      ====================================================== -->

      <section class="personal-duration-card">


        <div class="personal-duration-header">

          <div>

            <h2>
              ⏱️ Only Duration
            </h2>

            <p>
              Calculate time between In and Out
            </p>

          </div>

        </div>


        <div class="duration-input-grid">


          <div>

            <label for="personalInTime">
              In Time
            </label>

            <input
              id="personalInTime"
              type="time"
            >

          </div>


          <div>

            <label for="personalOutTime">
              Out Time
            </label>

            <input
              id="personalOutTime"
              type="time"
            >

          </div>


        </div>


        <button
          id="calculatePersonalDuration"
          class="primary-btn full-width"
          type="button"
        >
          Calculate Duration
        </button>


        <div
          id="personalDurationResult"
          class="personal-duration-result"
        >

          <span>
            Duration
          </span>

          <strong>
            0h 0m
          </strong>

        </div>


      </section>


      <!-- =====================================================
           QUICK ACTIONS
      ====================================================== -->

      <section>

        <div class="section-heading">

          <div>

            <h2>
              Quick Actions
            </h2>

            <p>
              Frequently used options
            </p>

          </div>

        </div>


        <div class="quick-actions">


          <!-- ADD ENTRY -->

          <button
            class="quick-action"
            type="button"
            onclick="window.location.href='/pages/add-entry.html'"
          >

            <span>
              ➕
            </span>

            <strong>
              Add Entry
            </strong>

            <span>
              Record vehicle entry
            </span>

          </button>


          <!-- VEHICLES -->

          <button
            class="quick-action"
            type="button"
            onclick="window.location.href='/pages/vehicles.html'"
          >

            <span>
              🚚
            </span>

            <strong>
              Vehicles
            </strong>

            <span>
              Manage vehicles
            </span>

          </button>


          <!-- CALENDAR -->

          <button
            class="quick-action"
            type="button"
            onclick="window.location.href='/pages/calendar.html'"
          >

            <span>
              📅
            </span>

            <strong>
              Calendar
            </strong>

            <span>
              View daily activity
            </span>

          </button>


          <!-- REPORTS -->

          <button
            class="quick-action"
            type="button"
            onclick="window.location.href='/pages/reports.html'"
          >

            <span>
              📊
            </span>

            <strong>
              Reports
            </strong>

            <span>
              View duration reports
            </span>

          </button>


        </div>

      </section>


      <!-- =====================================================
           TODAY ACTIVITY
      ====================================================== -->

      <section>

        <div class="section-heading">

          <div>

            <h2>
              Today's Activity
            </h2>

            <p>
              Latest vehicle entries
            </p>

          </div>

        </div>


        <div
          id="dashboardActivityList"
          class="activity-list"
        ></div>

      </section>


    </main>


    <!-- =====================================================
         BOTTOM NAVIGATION
    ====================================================== -->

    <nav class="bottom-nav">


      <button
        class="nav-item active"
        type="button"
        onclick="window.location.href='/pages/dashboard.html'"
      >

        <span>
          ⌂
        </span>

        <small>
          Home
        </small>

      </button>


      <button
        class="nav-item"
        type="button"
        onclick="window.location.href='/pages/vehicles.html'"
      >

        <span>
          🚚
        </span>

        <small>
          Vehicles
        </small>

      </button>


      <button
        class="nav-item add-nav"
        type="button"
        onclick="window.location.href='/pages/add-entry.html'"
        aria-label="Add Entry"
      >

        <span>
          +
        </span>

      </button>


      <button
        class="nav-item"
        type="button"
        onclick="window.location.href='/pages/calendar.html'"
      >

        <span>
          ▣
        </span>

        <small>
          Calendar
        </small>

      </button>


      <button
        class="nav-item"
        type="button"
        onclick="window.location.href='/pages/profile.html'"
      >

        <span>
          👤
        </span>

        <small>
          You
        </small>

      </button>


    </nav>


  </div>


  <script>

    /* =====================================================
       PERSONAL ONLY DURATION
    ====================================================== */

    const personalInTime =
      document.getElementById(
        "personalInTime"
      );

    const personalOutTime =
      document.getElementById(
        "personalOutTime"
      );

    const calculatePersonalDuration =
      document.getElementById(
        "calculatePersonalDuration"
      );

    const personalDurationResult =
      document.getElementById(
        "personalDurationResult"
      );


    calculatePersonalDuration.addEventListener(
      "click",
      function () {

        const inTime =
          personalInTime.value;

        const outTime =
          personalOutTime.value;


        if (!inTime || !outTime) {

          personalDurationResult.innerHTML = `
            <span>
              Please select In Time and Out Time
            </span>

            <strong>
              —
            </strong>
          `;

          return;
        }


        const inParts =
          inTime
            .split(":")
            .map(Number);


        const outParts =
          outTime
            .split(":")
            .map(Number);


        let start =
          inParts[0] * 60 +
          inParts[1];


        let end =
          outParts[0] * 60 +
          outParts[1];


        /*
          If Out Time is earlier than
          In Time, assume it crossed midnight.
        */

        if (end < start) {
          end += 24 * 60;
        }


        const totalMinutes =
          end - start;


        const hours =
          Math.floor(
            totalMinutes / 60
          );


        const minutes =
          totalMinutes % 60;


        personalDurationResult.innerHTML = `
          <span>
            Total Duration
          </span>

          <strong>
            ${hours}h ${minutes}m
          </strong>
        `;

      }
    );


    /* =====================================================
       LIVE RECALCULATION
    ====================================================== */

    personalInTime.addEventListener(
      "change",
      function () {

        if (
          personalOutTime.value
        ) {
          calculatePersonalDuration.click();
        }

      }
    );


    personalOutTime.addEventListener(
      "change",
      function () {

        if (
          personalInTime.value
        ) {
          calculatePersonalDuration.click();
        }

      }
    );

  </script>


  <script src="../app.js"></script>

</body>

</html>
