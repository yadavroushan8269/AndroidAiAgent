<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f5a400"
  >

  <title>MY HOME GROUP @Developed_by-ROUSHAN-YADAV</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >
</head>

<body>

  <div class="app-page">

    <header class="top-header">

      <div>

        <h1 id="dashboardTitle">
          Dashboard
        </h1>

        <p id="dashboardDate">
          Today
        </p>

      </div>

      <button
        id="notificationBtn"
        class="header-action notification-badge"
        type="button"
      >
        🔔
      </button>

    </header>


    <main class="page-content">


      <section class="dashboard-welcome">

        <h2 id="welcomeName">
          Welcome
        </h2>

        <p>
          This app/web is made for the  construction side
        </p>

      </section>


      <section class="stats-grid">

        <div class="stat-card">

          <strong id="dashboardVehicleCount">
            0
          </strong>

          <span>
            Vehicles
          </span>

        </div>


        <div class="stat-card green">

          <strong id="dashboardRunningCount">
            0
          </strong>

          <span>
            Running
          </span>

        </div>


        <div class="stat-card orange">

          <strong id="dashboardEntryCount">
            0
          </strong>

          <span>
            Today's Entries
          </span>

        </div>


        <div class="stat-card blue">

          <strong id="dashboardDuration">
            0h 0m
          </strong>

          <span>
            Total Duration
          </span>

        </div>

      </section>


      <section>

        <div class="section-heading">

          <div>

            <h2>
              Quick Actions
            </h2>

            <p>
              Frequently used options
            </p>

          </div>

        </div>


        <div class="quick-actions">


          <button
            class="quick-action"
            type="button"
            onclick="window.location.href='/pages/add-entry.html'"
          >

            <span>
              Get
            </span>

            <strong>
              Duration Time
            </strong>

            <span>
              By saved vehicles/users
            </span>

          </button>


          <button
            class="quick-action"
            type="button"
            onclick="window.location.href='/pages/vehicles.html'"
          >

            <span>
              Add
            </span>

            <strong>
              Vehicle Details/Operator
            </strong>

            <span>
              Manage vehicles and user
            </span>

          </button>


          <button
            class="quick-action"
            type="button"
            onclick="window.location.href='/pages/calendar.html'"
          >

            <span>
              📅
            </span>

            <strong>
              Calendar
            </strong>

            <span>
              View daily activity
            </span>

          </button>


          <button
            class="quick-action"
            type="button"
            onclick="window.location.href='/pages/reports.html'"
          >

            <span>
              📊
            </span>

            <strong>
              Reports
            </strong>

            <span>
              View duration reports
            </span>

          </button>


        </div>

      </section>


      <section>

        <div class="section-heading">

          <div>

            <h2>
              Today's Activity
            </h2>

            <p>
              Latest vehicle entries
            </p>

          </div>

        </div>


        <div
          id="dashboardActivityList"
          class="activity-list"
        ></div>

      </section>

    </main>


    <!-- =====================================================
         BOTTOM NAVIGATION
    ====================================================== -->

    <nav class="bottom-nav">


      <button
        class="nav-item active"
        type="button"
        onclick="window.location.href='/pages/dashboard.html'"
      >

        <span>
          ⌂
        </span>

        <small>
          Home
        </small>

      </button>


      <button
        class="nav-item"
        type="button"
        onclick="window.location.href='/pages/vehicles.html'"
      >

        <span>
          🚚
        </span>

        <small>
          Vehicles
        </small>

      </button>


      <button
        class="nav-item add-nav"
        type="button"
        onclick="window.location.href='/pages/add-entry.html'"
        aria-label="Add Entry"
      >

        <span>
          +
        </span>

      </button>


      <button
        class="nav-item"
        type="button"
        onclick="window.location.href='/pages/calendar.html'"
      >

        <span>
          ▣
        </span>

        <small>
          Calendar
        </small>

      </button>


      <button
        class="nav-item"
        type="button"
        onclick="window.location.href='/pages/profile.html'"
      >

        <span>
          👤
        </span>

        <small>
          You
        </small>

      </button>


    </nav>

  </div>


  <script src="../app.js"></script>

</body>

</html>
