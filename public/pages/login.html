<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f5a400"
  >

  <title>Login - My-Home-Group</title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f5f7fa;
      box-sizing: border-box;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 22px;
      padding: 25px 20px;
      box-sizing: border-box;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    .login-logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff5d9;
      font-size: 38px;
    }

    .login-card h1 {
      margin: 0;
      text-align: center;
      font-size: 27px;
      color: #222;
    }

    .subtitle {
      margin: 7px 0 22px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    .form-group {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 700;
      color: #333;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 12px;
      border: 1px solid #d5dbe0;
      border-radius: 11px;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #f5a400;
      box-shadow: 0 0 0 3px rgba(245, 164, 0, 0.12);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 52px;
    }

    .show-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
      padding: 8px;
    }

    .forgot-btn {
      display: block;
      width: fit-content;
      margin: 0 0 16px auto;
      border: none;
      background: none;
      color: #c27d00;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      padding: 4px;
    }

    .message {
      min-height: 20px;
      margin: 10px 0;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .message.error {
      color: #c62828;
    }

    .message.success {
      color: #16803c;
    }

    .full-width {
      width: 100%;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0;
      color: #999;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #e1e4e7;
    }

    .register-link {
      text-align: center;
      font-size: 14px;
      color: #666;
    }

    .register-link a {
      color: #c27d00;
      font-weight: 800;
      text-decoration: none;
    }

    /* Forgot password modal */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.55);
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 430px;
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      border-radius: 20px;
      padding: 21px;
      box-sizing: border-box;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 21px;
    }

    .close-btn {
      width: 35px;
      height: 35px;
      border: none;
      border-radius: 50%;
      background: #f1f2f3;
      font-size: 20px;
      cursor: pointer;
    }

    .modal-text {
      margin: 0 0 18px;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }

    .reset-step {
      display: none;
    }

    .reset-step.active {
      display: block;
    }

    .account-found {
      margin: 12px 0;
      padding: 12px;
      border-radius: 11px;
      background: #f5f7f8;
      font-size: 13px;
    }

    .account-found strong {
      display: block;
      margin-bottom: 3px;
      color: #222;
    }

    .modal-buttons {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    .secondary-btn {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5d9df;
      border-radius: 11px;
      background: #fff;
      color: #333;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .login-page {
        padding: 12px;
      }

      .login-card {
        padding: 22px 16px;
      }
    }
  </style>
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-logo">
        🚧
      </div>

      <h1>
        Welcome Back
      </h1>

      <p class="subtitle">
        Login to My-Home-Group
      </p>


      <!-- LOGIN FORM -->

      <form
        id="loginForm"
        novalidate
      >

        <div class="form-group">

          <label for="loginIdentifier">
            Email or Mobile
          </label>

          <input
            id="loginIdentifier"
            type="text"
            placeholder="Enter email or mobile"
            autocomplete="username"
          >

        </div>


        <div class="form-group">

          <label for="loginPassword">
            Password
          </label>

          <div class="password-wrap">

            <input
              id="loginPassword"
              type="password"
              placeholder="Enter password"
              autocomplete="current-password"
            >

            <button
              id="showPasswordBtn"
              class="show-password"
              type="button"
              aria-label="Show password"
            >
              👁️
            </button>

          </div>

        </div>


        <button
          id="forgotPasswordBtn"
          class="forgot-btn"
          type="button"
        >
          Forgot Password?
        </button>


        <div
          id="loginMessage"
          class="message"
        ></div>


        <button
          class="primary-btn full-width"
          type="submit"
        >
          Login
        </button>

      </form>


      <div class="divider">
        OR
      </div>


      <div class="register-link">

        Don't have an account?

        <a href="/pages/register.html">
          Create Account
        </a>

      </div>

    </section>

  </main>


  <!-- FORGOT PASSWORD MODAL -->

  <div
    id="forgotModal"
    class="modal"
  >

    <div class="modal-card">

      <div class="modal-header">

        <h2>
          Reset Password
        </h2>

        <button
          id="closeForgotBtn"
          class="close-btn"
          type="button"
        >
          ×
        </button>

      </div>


      <!-- STEP 1 -->

      <div
        id="resetStep1"
        class="reset-step active"
      >

        <p class="modal-text">
          Apna registered email ya mobile number enter karo.
        </p>


        <div class="form-group">

          <label for="resetIdentifier">
            Email or Mobile
          </label>

          <input
            id="resetIdentifier"
            type="text"
            placeholder="Email or mobile"
          >

        </div>


        <div
          id="resetMessage1"
          class="message"
        ></div>


        <div class="modal-buttons">

          <button
            id="findAccountBtn"
            class="primary-btn"
            type="button"
          >
            Find Account
          </button>

          <button
            id="cancelResetBtn"
            class="secondary-btn"
            type="button"
          >
            Cancel
          </button>

        </div>

      </div>


      <!-- STEP 2 -->

      <div
        id="resetStep2"
        class="reset-step"
      >

        <p class="modal-text">
          Account mil gaya. Ab naya password set karo.
        </p>


        <div
          id="accountFound"
          class="account-found"
        ></div>


        <div class="form-group">

          <label for="newPassword">
            New Password
          </label>

          <input
            id="newPassword"
            type="password"
            placeholder="Minimum 6 characters"
          >

        </div>


        <div class="form-group">

          <label for="confirmNewPassword">
            Confirm New Password
          </label>

          <input
            id="confirmNewPassword"
            type="password"
            placeholder="Enter password again"
          >

        </div>


        <div
          id="resetMessage2"
          class="message"
        ></div>


        <div class="modal-buttons">

          <button
            id="resetPasswordBtn"
            class="primary-btn"
            type="button"
          >
            Reset Password
          </button>

          <button
            id="backResetBtn"
            class="secondary-btn"
            type="button"
          >
            Back
          </button>

        </div>

      </div>

    </div>

  </div>


  <script>

    const STORAGE = {
      users: "hyma_users",
      currentUser: "hyma_current_user"
    };


    let resetUserId = null;


    function readJSON(
      key,
      fallback
    ) {

      try {

        const value =
          localStorage.getItem(key);

        return value
          ? JSON.parse(value)
          : fallback;

      } catch (error) {

        return fallback;

      }

    }


    function writeJSON(
      key,
      value
    ) {

      localStorage.setItem(
        key,
        JSON.stringify(value)
      );

    }


    function getUsers() {

      return readJSON(
        STORAGE.users,
        []
      );

    }


    function showLoginMessage(
      text,
      type
    ) {

      const message =
        document.getElementById(
          "loginMessage"
        );

      message.textContent =
        text;

      message.className =
        "message " +
        (type || "");

    }


    function showResetMessage(
      step,
      text,
      type
    ) {

      const id =
        step === 1
          ? "resetMessage1"
          : "resetMessage2";


      const message =
        document.getElementById(
          id
        );


      message.textContent =
        text;


      message.className =
        "message " +
        (type || "");

    }


    function login(
      event
    ) {

      event.preventDefault();


      const identifier =
        document.getElementById(
          "loginIdentifier"
        ).value
          .trim()
          .toLowerCase();


      const password =
        document.getElementById(
          "loginPassword"
        ).value;


      if (!identifier) {

        showLoginMessage(
          "Email ya mobile enter karo.",
          "error"
        );

        return;

      }


      if (!password) {

        showLoginMessage(
          "Password enter karo.",
          "error"
        );

        return;

      }


      const users =
        getUsers();


      const user =
        users.find(
          function (item) {

            const email =
              String(
                item.email || ""
              )
                .trim()
                .toLowerCase();


            const mobile =
              String(
                item.mobile || ""
              )
                .replace(
                  /\s+/g,
                  ""
                );


            const enteredMobile =
              identifier.replace(
                /\s+/g,
                ""
              );


            return (
              email === identifier ||
              mobile === enteredMobile
            );

          }
        );


      if (!user) {

        showLoginMessage(
          "Account nahi mila. Email/mobile check karo.",
          "error"
        );

        return;

      }


      if (
        String(
          user.password || ""
        ) !== password
      ) {

        showLoginMessage(
          "Password incorrect hai.",
          "error"
        );

        return;

      }


      writeJSON(
        STORAGE.currentUser,
        user
      );


      showLoginMessage(
        "Login successful. Opening dashboard...",
        "success"
      );


      setTimeout(
        function () {

          window.location.href =
            "/pages/dashboard.html";

        },
        500
      );

    }


    function openForgotPassword() {

      document.getElementById(
        "forgotModal"
      ).classList.add(
        "show"
      );


      document.getElementById(
        "resetStep1"
      ).classList.add(
        "active"
      );


      document.getElementById(
        "resetStep2"
      ).classList.remove(
        "active"
      );


      document.getElementById(
        "resetIdentifier"
      ).value =
        document.getElementById(
          "loginIdentifier"
        ).value.trim();


      showResetMessage(
        1,
        "",
        ""
      );


      showResetMessage(
        2,
        "",
        ""
      );

    }


    function closeForgotPassword() {

      document.getElementById(
        "forgotModal"
      ).classList.remove(
        "show"
      );


      resetUserId =
        null;

    }


    function findAccount() {

      const identifier =
        document.getElementById(
          "resetIdentifier"
        ).value
          .trim()
          .toLowerCase();


      if (!identifier) {

        showResetMessage(
          1,
          "Email ya mobile enter karo.",
          "error"
        );

        return;

      }


      const users =
        getUsers();


      const user =
        users.find(
          function (item) {

            const email =
              String(
                item.email || ""
              )
                .trim()
                .toLowerCase();


            const mobile =
              String(
                item.mobile || ""
              )
                .replace(
                  /\s+/g,
                  ""
                );


            const enteredMobile =
              identifier.replace(
                /\s+/g,
                ""
              );


            return (
              email === identifier ||
              mobile === enteredMobile
            );

          }
        );


      if (!user) {

        showResetMessage(
          1,
          "Is email/mobile se account nahi mila.",
          "error"
        );

        return;

      }


      resetUserId =
        user.id ||
        user.email;


      document.getElementById(
        "accountFound"
      ).innerHTML = `

        <strong>
          ${escapeHTML(
            user.name ||
            "User"
          )}
        </strong>

        ${escapeHTML(
          user.email ||
          user.mobile ||
          ""
        )}

      `;


      document.getElementById(
        "resetStep1"
      ).classList.remove(
        "active"
      );


      document.getElementById(
        "resetStep2"
      ).classList.add(
        "active"
      );


      document.getElementById(
        "newPassword"
      ).value =
        "";


      document.getElementById(
        "confirmNewPassword"
      ).value =
        "";


      showResetMessage(
        2,
        "",
        ""
      );

    }


    function resetPassword() {

      if (!resetUserId) {

        return;

      }


      const newPassword =
        document.getElementById(
          "newPassword"
        ).value;


      const confirmPassword =
        document.getElementById(
          "confirmNewPassword"
        ).value;


      if (
        newPassword.length < 6
      ) {

        showResetMessage(
          2,
          "Password minimum 6 characters ka hona chahiye.",
          "error"
        );

        return;

      }


      if (
        newPassword !==
        confirmPassword
      ) {

        showResetMessage(
          2,
          "Passwords match nahi kar rahe.",
          "error"
        );

        return;

      }


      const users =
        getUsers();


      const index =
        users.findIndex(
          function (user) {

            return (
              (
                user.id ||
                user.email
              ) ===
              resetUserId
            );

          }
        );


      if (index === -1) {

        showResetMessage(
          2,
          "Account nahi mila. Dobara try karo.",
          "error"
        );

        return;

      }


      users[index].password =
        newPassword;


      writeJSON(
        STORAGE.users,
        users
      );


      showResetMessage(
        2,
        "Password successfully reset ho gaya.",
        "success"
      );


      setTimeout(
        function () {

          closeForgotPassword();


          document.getElementById(
            "loginIdentifier"
          ).value =
            users[index].email ||
            users[index].mobile ||
            "";


          document.getElementById(
            "loginPassword"
          ).value =
            "";


          showLoginMessage(
            "Password reset ho gaya. Ab new password se login karo.",
            "success"
          );

        },
        900
      );

    }


    function backToStepOne() {

      document.getElementById(
        "resetStep2"
      ).classList.remove(
        "active"
      );


      document.getElementById(
        "resetStep1"
      ).classList.add(
        "active"
      );


      showResetMessage(
        1,
        "",
        ""
      );

    }


    function togglePassword() {

      const input =
        document.getElementById(
          "loginPassword"
        );


      const button =
        document.getElementById(
          "showPasswordBtn"
        );


      if (
        input.type ===
        "password"
      ) {

        input.type =
          "text";

        button.textContent =
          "🙈";

      } else {

        input.type =
          "password";

        button.textContent =
          "👁️";

      }

    }


    function escapeHTML(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    document.addEventListener(
      "DOMContentLoaded",
      function () {

        document.getElementById(
          "loginForm"
        ).addEventListener(
          "submit",
          login
        );


        document.getElementById(
          "forgotPasswordBtn"
        ).addEventListener(
          "click",
          openForgotPassword
        );


        document.getElementById(
          "closeForgotBtn"
        ).addEventListener(
          "click",
          closeForgotPassword
        );


        document.getElementById(
          "cancelResetBtn"
        ).addEventListener(
          "click",
          closeForgotPassword
        );


        document.getElementById(
          "findAccountBtn"
        ).addEventListener(
          "click",
          findAccount
        );


        document.getElementById(
          "resetPasswordBtn"
        ).addEventListener(
          "click",
          resetPassword
        );


        document.getElementById(
          "backResetBtn"
        ).addEventListener(
          "click",
          backToStepOne
        );


        document.getElementById(
          "showPasswordBtn"
        ).addEventListener(
          "click",
          togglePassword
        );


        document.getElementById(
          "forgotModal"
        ).addEventListener(
          "click",
          function (event) {

            if (
              event.target.id ===
              "forgotModal"
            ) {

              closeForgotPassword();

            }

          }
        );

      }
    );

  </script>

</body>

</html>
