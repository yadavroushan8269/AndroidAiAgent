<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login — MY HOME GROUP</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="auth-brand">
        <div class="brand-logo">MH</div>

        <h1>MY HOME GROUP</h1>

        <p>
          Vehicle Duration Management
        </p>
      </div>

      <h2>Welcome Back</h2>

      <form id="loginForm">

        <div class="form-group">
          <label for="loginValue">
            Mobile / Email
          </label>

          <input
            id="loginValue"
            class="form-control"
            type="text"
            placeholder="Mobile / Email"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">
            Password
          </label>

          <input
            id="loginPassword"
            class="form-control"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          >

          <a
            href="#"
            class="forgot-link"
            onclick="alert('Password reset will be connected next.'); return false;"
          >
            Forgot Password?
          </a>
        </div>

        <div class="form-actions">

          <button
            id="loginButton"
            class="btn btn-primary"
            type="submit"
          >
            Login
          </button>

        </div>

      </form>

      <div class="auth-links">
        Don't have an account?
        <a href="/register">
          Create Account
        </a>
      </div>

    </section>

  </main>

  <script src="/app.js"></script>

</body>
</html>
