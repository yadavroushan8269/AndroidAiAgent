<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5a400">
  <meta
    name="description"
    content="Hyma RMC Kokapet Vehicle Calendar"
  >
  <title>Calendar - Hyma RMC Kokapet</title>

  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <div class="app-page">

    <!-- HEADER -->

    <header class="top-header">

      <div>
        <h1>Calendar</h1>
        <p>Vehicle activity by date</p>
      </div>

      <button
        id="calendarTodayBtn"
        class="header-action"
        type="button"
      >
        Today
      </button>

    </header>


    <!-- MAIN -->

    <main class="page-content">

      <!-- MONTH NAVIGATION -->

      <section class="calendar-month-bar">

        <button
          id="previousMonthBtn"
          class="month-btn"
          type="button"
          aria-label="Previous month"
        >
          ‹
        </button>

        <h2 id="currentMonth">
          Month Year
        </h2>

        <button
          id="nextMonthBtn"
          class="month-btn"
          type="button"
          aria-label="Next month"
        >
          ›
        </button>

      </section>


      <!-- WEEK DAYS -->

      <div class="calendar-weekdays">

        <span>Sun</span>
        <span>Mon</span>
        <span>Tue</span>
        <span>Wed</span>
        <span>Thu</span>
        <span>Fri</span>
        <span>Sat</span>

      </div>


      <!-- CALENDAR -->

      <section
        id="calendarGrid"
        class="calendar-grid"
      ></section>


      <!-- SELECTED DATE -->

      <section class="selected-date-card">

        <div class="selected-date-heading">

          <div>
            <span>Selected Date</span>

            <h2 id="activityDateText">
              Today
            </h2>
          </div>

          <div class="selected-date-icon">
            📅
          </div>

        </div>


        <!-- SUMMARY -->

        <div class="calendar-summary">

          <div class="calendar-summary-item">

            <strong id="calendarVehicleCount">
              0
            </strong>

            <span>
              Vehicles
            </span>

          </div>


          <div class="calendar-summary-item">

            <strong id="calendarEntryCount">
              0
            </strong>

            <span>
              Entries
            </span>

          </div>


          <div class="calendar-summary-item">

            <strong id="calendarDuration">
              0h 0m
            </strong>

            <span>
              Duration
            </span>

          </div>

        </div>

      </section>


      <!-- ACTIVITY -->

      <section class="calendar-activity-section">

        <div class="section-heading">

          <div>
            <h2>Vehicle Activity</h2>
            <p>
              Entries recorded on selected date
            </p>
          </div>

        </div>


        <div
          id="calendarEntryList"
          class="activity-list"
        ></div>

      </section>

    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

      <button
        class="nav-item"
        data-page="dashboard"
        type="button"
      >
        <span>⌂</span>
        <small>Home</small>
      </button>


      <button
        class="nav-item"
        data-page="vehicles"
        type="button"
      >
        <span>🚚</span>
        <small>Vehicles</small>
      </button>


      <button
        class="nav-item add-nav"
        data-page="add-entry"
        type="button"
      >
        <span>+</span>
      </button>


      <button
        class="nav-item active"
        data-page="calendar"
        type="button"
      >
        <span>▣</span>
        <small>Calendar</small>
      </button>


      <button
        class="nav-item"
        data-page="profile"
        type="button"
      >
        <span>👤</span>
        <small>You</small>
      </button>

    </nav>

  </div>


  <script src="../app.js"></script>

</body>
</html>
