<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calendar - My Home Group</title>

  <link rel="stylesheet" href="../style.css">

  <style>
    .page-wrap{
      max-width:1200px;
      margin:0 auto;
      padding:20px;
      padding-bottom:105px;
    }

    .page-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      margin-bottom:20px;
    }

    .page-header h1{
      margin:0;
      font-size:26px;
    }

    .page-header p{
      margin:5px 0 0;
      font-size:13px;
      opacity:.65;
    }

    .back-btn{
      border:0;
      background:#eef1f4;
      border-radius:10px;
      padding:10px 13px;
      cursor:pointer;
      font-weight:700;
    }

    .calendar-card{
      background:#fff;
      border:1px solid #e3e7eb;
      border-radius:16px;
      padding:18px;
      margin-bottom:18px;
      box-shadow:0 3px 12px rgba(0,0,0,.04);
    }

    .date-row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      align-items:end;
    }

    .field label{
      display:block;
      font-size:12px;
      font-weight:700;
      margin-bottom:6px;
    }

    .field input{
      width:100%;
      box-sizing:border-box;
      padding:12px;
      border:1px solid #d8dde2;
      border-radius:10px;
      background:#fff;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin-top:15px;
    }

    .summary{
      border:1px solid #edf0f2;
      border-radius:12px;
      padding:14px;
    }

    .summary-label{
      font-size:11px;
      opacity:.65;
    }

    .summary-value{
      margin-top:4px;
      font-size:22px;
      font-weight:800;
    }

    .entries-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:14px;
    }

    .entries-head h2{
      margin:0;
      font-size:18px;
    }

    .entry-list{
      display:grid;
      gap:10px;
    }

    .entry-card{
      border:1px solid #e9ecef;
      border-radius:13px;
      padding:14px;
      display:flex;
      justify-content:space-between;
      gap:15px;
      align-items:center;
    }

    .vehicle{
      font-size:16px;
      font-weight:800;
    }

    .meta{
      margin-top:5px;
      font-size:12px;
      line-height:1.7;
      opacity:.7;
    }

    .duration{
      text-align:right;
      white-space:nowrap;
      font-weight:800;
    }

    .running{
      color:#16803c;
    }

    .empty{
      text-align:center;
      padding:35px 15px;
      opacity:.65;
    }

    .loading{
      text-align:center;
      padding:30px;
      opacity:.65;
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:5000;
      display:flex;
      justify-content:space-around;
      background:#fff;
      border-top:1px solid #ddd;
      padding:8px 5px calc(8px + env(safe-area-inset-bottom));
      box-shadow:0 -3px 12px rgba(0,0,0,.06);
    }

    .bottom-nav a{
      text-decoration:none;
      color:#555;
      font-size:11px;
      text-align:center;
      padding:6px 8px;
    }

    .bottom-nav a.active{
      color:#111;
      font-weight:800;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:90px;
      transform:translateX(-50%) translateY(100px);
      background:#16191d;
      color:#fff;
      padding:12px 18px;
      border-radius:10px;
      font-size:14px;
      z-index:9999;
      transition:.25s ease;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
    }

    @media(max-width:650px){
      .page-wrap{
        padding:15px;
        padding-bottom:100px;
      }

      .page-header h1{
        font-size:22px;
      }

      .date-row{
        grid-template-columns:1fr;
      }

      .summary-grid{
        grid-template-columns:1fr 1fr;
      }

      .summary:last-child{
        grid-column:1 / -1;
      }

      .entry-card{
        align-items:flex-start;
      }

      .duration{
        font-size:12px;
      }
    }
  </style>
</head>

<body>

  <main class="page-wrap">

    <!-- HEADER -->

    <header class="page-header">

      <div>
        <h1>📅 Calendar</h1>
        <p>View vehicle activity date-wise</p>
      </div>

      <button
        class="back-btn"
        onclick="window.location.href='dashboard.html'"
      >
        ← Dashboard
      </button>

    </header>


    <!-- DATE SELECTOR -->

    <section class="calendar-card">

      <div class="date-row">

        <div class="field">

          <label for="selectedDate">
            Select Date
          </label>

          <input
            id="selectedDate"
            type="date"
          >

        </div>

        <button
          id="todayButton"
          class="btn btn-primary"
          type="button"
        >
          Today
        </button>

      </div>


      <!-- SUMMARY -->

      <div class="summary-grid">

        <div class="summary">

          <div class="summary-label">
            Total Entries
          </div>

          <div
            id="entryCount"
            class="summary-value"
          >
            0
          </div>

        </div>


        <div class="summary">

          <div class="summary-label">
            Vehicles
          </div>

          <div
            id="vehicleCount"
            class="summary-value"
          >
            0
          </div>

        </div>


        <div class="summary">

          <div class="summary-label">
            Total Duration
          </div>

          <div
            id="totalDuration"
            class="summary-value"
          >
            0 min
          </div>

        </div>

      </div>

    </section>


    <!-- ENTRIES -->

    <section class="calendar-card">

      <div class="entries-head">

        <h2>
          Vehicle Entries
        </h2>

        <button
          id="addEntryButton"
          class="btn btn-primary"
          type="button"
        >
          + Add Entry
        </button>

      </div>


      <div
        id="entryList"
        class="entry-list"
      >

        <div class="loading">
          Loading...
        </div>

      </div>

    </section>

  </main>


  <!-- MOBILE NAV -->

  <nav class="bottom-nav">

    <a href="dashboard.html">
      🏠<br>
      Home
    </a>

    <a href="vehicles.html">
      🚚<br>
      Vehicles
    </a>

    <a href="add-entry.html">
      ➕<br>
      Entry
    </a>

    <a
      href="calendar.html"
      class="active"
    >
      📅<br>
      Calendar
    </a>

    <a href="profile.html">
      👤<br>
      You
    </a>

  </nav>


  <div
    id="toast"
    class="toast"
  ></div>


  <script src="../app.js"></script>


  <script>
    "use strict";


    let allEntries = [];


    /* =====================================================
       HELPERS
    ===================================================== */

    function escapeHTML(value){

      const div =
        document.createElement("div");

      div.textContent =
        value == null
          ? ""
          : String(value);

      return div.innerHTML;

    }


    function getDate(entry){

      return (
        entry.entry_date ||
        entry.entryDate ||
        entry.date ||
        ""
      );

    }


    function getVehicleNumber(entry){

      return (
        entry.vehicle_number ||
        entry.vehicleNumber ||
        "Unknown"
      );

    }


    function getVehicleType(entry){

      return (
        entry.vehicle_type ||
        entry.vehicleType ||
        "-"
      );

    }


    function getDriver(entry){

      return (
        entry.driver_name ||
        entry.driverName ||
        "-"
      );

    }


    function getContractor(entry){

      return (
        entry.contractor ||
        "-"
      );

    }


    function getEntryTime(entry){

      return (
        entry.entry_time ||
        entry.entryTime ||
        "-"
      );

    }


    function getExitTime(entry){

      return (
        entry.exit_time ||
        entry.exitTime ||
        ""
      );

    }


    function getPurpose(entry){

      return (
        entry.purpose ||
        "-"
      );

    }


    function getNotes(entry){

      return (
        entry.notes ||
        ""
      );

    }


    function getDuration(entry){

      return Number(
        entry.duration
      ) || 0;

    }


    /* =====================================================
       LOAD DATA
    ===================================================== */

    async function loadEntries(){

      const list =
        document.getElementById(
          "entryList"
        );


      list.innerHTML = `
        <div class="loading">
          Loading entries...
        </div>
      `;


      try{

        allEntries =
          await window.MyHomeGroup
            .getEntries();


        allEntries =
          allEntries || [];


        renderSelectedDate();

      }catch(error){

        console.error(
          "Calendar:",
          error
        );


        list.innerHTML = `
          <div class="empty">
            Unable to load entries.
            <br>
            <small>
              ${escapeHTML(
                error.message
              )}
            </small>
          </div>
        `;

      }

    }


    /* =====================================================
       RENDER SELECTED DATE
    ===================================================== */

    function renderSelectedDate(){

      const date =
        document.getElementById(
          "selectedDate"
        ).value;


      const selectedEntries =
        allEntries
          .filter(
            entry =>
              getDate(entry) === date
          )
          .sort(
            (
              a,
              b
            ) => {

              return (
                getEntryTime(b)
                  .localeCompare(
                    getEntryTime(a)
                  )
              );

            }
          );


      updateSummary(
        selectedEntries
      );


      renderEntries(
        selectedEntries
      );

    }


    /* =====================================================
       SUMMARY
    ===================================================== */

    function updateSummary(
      selectedEntries
    ){

      const uniqueVehicles =
        new Set(
          selectedEntries.map(
            entry =>
              getVehicleNumber(
                entry
              )
          )
        );


      const totalDuration =
        selectedEntries.reduce(
          (
            total,
            entry
          ) => {

            return (
              total +
              getDuration(
                entry
              )
            );

          },
          0
        );


      document.getElementById(
        "entryCount"
      ).textContent =
        selectedEntries.length;


      document.getElementById(
        "vehicleCount"
      ).textContent =
        uniqueVehicles.size;


      document.getElementById(
        "totalDuration"
      ).textContent =
        window.MyHomeGroup
          .durationText(
            totalDuration
          );

    }


    /* =====================================================
       RENDER ENTRIES
    ===================================================== */

    function renderEntries(
      selectedEntries
    ){

      const list =
        document.getElementById(
          "entryList"
        );


      if(
        selectedEntries.length === 0
      ){

        list.innerHTML = `

          <div class="empty">

            <div style="font-size:38px;">
              📋
            </div>

            <div>
              No vehicle entries found
              for this date.
            </div>

            <button
              class="btn btn-primary"
              style="margin-top:12px;"
              onclick="window.location.href='add-entry.html'"
            >
              + Add Entry
            </button>

          </div>

        `;

        return;

      }


      list.innerHTML = "";


      selectedEntries.forEach(
        entry => {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "entry-card";


          const exitTime =
            getExitTime(
              entry
            );


          const running =
            !exitTime;


          const duration =
            getDuration(
              entry
            );


          card.innerHTML = `

            <div>

              <div class="vehicle">

                ${escapeHTML(
                  getVehicleNumber(
                    entry
                  )
                )}

                ${
                  running
                    ? `<span class="running">
                         · Running
                       </span>`
                    : ""
                }

              </div>


              <div class="meta">

                Type:
                ${escapeHTML(
                  getVehicleType(
                    entry
                  )
                )}

                <br>

                Driver:
                ${escapeHTML(
                  getDriver(
                    entry
                  )
                )}

                <br>

                Contractor:
                ${escapeHTML(
                  getContractor(
                    entry
                  )
                )}

                <br>

                Entry:
                ${escapeHTML(
                  getEntryTime(
                    entry
                  )
                )}

                &nbsp; | &nbsp;

                Exit:
                ${escapeHTML(
                  exitTime || "—"
                )}

                <br>

                Purpose:
                ${escapeHTML(
                  getPurpose(
                    entry
                  )
                )}

                ${
                  getNotes(entry)
                    ? `<br>Notes:
                       ${escapeHTML(
                         getNotes(entry)
                       )}`
                    : ""
                }

              </div>

            </div>


            <div class="duration">

              ${
                running
                  ? `<span class="running">
                       Running
                     </span>`
                  : window.MyHomeGroup
                      .durationText(
                        duration
                      )
              }

            </div>

          `;


          list.appendChild(
            card
          );

        }
      );

    }


    /* =====================================================
       SET TODAY
    ===================================================== */

    function setToday(){

      const today =
        window.MyHomeGroup.today();


      document.getElementById(
        "selectedDate"
      ).value =
        today;


      renderSelectedDate();

    }


    /* =====================================================
       EVENTS
    ===================================================== */

    document
      .getElementById(
        "selectedDate"
      )
      .addEventListener(
        "change",
        renderSelectedDate
      );


    document
      .getElementById(
        "todayButton"
      )
      .addEventListener(
        "click",
        setToday
      );


    document
      .getElementById(
        "addEntryButton"
      )
      .addEventListener(
        "click",
        () => {

          window.location.href =
            "add-entry.html";

        }
      );


    /* =====================================================
       INIT
    ===================================================== */

    document.getElementById(
      "selectedDate"
    ).value =
      window.MyHomeGroup.today();


    loadEntries();

  </script>

</body>
</html>
