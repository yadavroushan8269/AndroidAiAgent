<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Calendar — MY HOME GROUP</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <div class="page">

    <header class="app-header">

      <div class="app-header-inner">

        <a
          href="/dashboard"
          class="header-brand"
        >
          <div class="brand-logo">MH</div>

          <div>
            <strong>MY HOME GROUP</strong>
            <span>Calendar</span>
          </div>
        </a>

        <div class="header-actions">

          <a
            href="/pages/notifications.html"
            class="icon-btn"
          >
            🔔
            <span
              class="notification-badge hidden"
            >
              0
            </span>
          </a>

          <a
            href="/pages/profile.html"
            class="icon-btn"
          >
            👤
          </a>

        </div>

      </div>

    </header>

    <main class="page-content">

      <div class="page-title">

        <h1>CALENDAR</h1>

        <p>
          View vehicle activity by date.
        </p>

      </div>

      <div class="calendar-layout">

        <section class="card calendar-card">

          <div class="calendar-header">

            <button
              class="icon-btn"
              type="button"
              onclick="previousMonth()"
            >
              ‹
            </button>

            <h2 id="calendarMonth">
              October 2026
            </h2>

            <button
              class="icon-btn"
              type="button"
              onclick="nextMonth()"
            >
              ›
            </button>

          </div>

          <div class="calendar-weekdays">

            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
            <div>Sun</div>

          </div>

          <div
            id="calendarDays"
            class="calendar-days"
          ></div>

        </section>

        <section class="card">

          <div class="selected-date">

            <strong>
              Selected Date
            </strong>

            <span
              id="selectedCalendarDate"
            >
              08 October 2026
            </span>

          </div>

          <h2 class="card-title">
            Today's Vehicles
          </h2>

          <div
            id="calendarEntries"
            class="activity-list"
          >
            <div class="loading">
              Loading...
            </div>
          </div>

          <div
            style="
              margin-top:18px;
              padding-top:18px;
              border-top:1px solid var(--border);
              display:flex;
              justify-content:space-between;
            "
          >
            <strong>Total</strong>

            <strong
              id="calendarTotal"
              class="text-success"
            >
              0h 0m
            </strong>
          </div>

        </section>

      </div>

    </main>

    <nav class="bottom-nav">

      <div class="bottom-nav-inner">

        <a href="/dashboard">
          <span>🏠</span>
          <span>Home</span>
        </a>

        <a href="/pages/vehicles.html">
          <span>🚚</span>
          <span>Vehicles</span>
        </a>

        <a
          href="/pages/add-entry.html"
          class="entry-button"
        >
          <span>＋</span>
          <span>Entry</span>
        </a>

        <a
          href="/pages/calendar.html"
          class="active"
        >
          <span>📅</span>
          <span>Calendar</span>
        </a>

        <a href="/pages/profile.html">
          <span>👤</span>
          <span>You</span>
        </a>

      </div>

    </nav>

  </div>

  <script src="/app.js"></script>

</body>
</html>
