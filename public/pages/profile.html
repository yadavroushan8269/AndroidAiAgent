<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Profile — MY HOME GROUP</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <div class="page">

    <header class="app-header">

      <div class="app-header-inner">

        <a
          href="/dashboard"
          class="header-brand"
        >
          <div class="brand-logo">MH</div>

          <div>
            <strong>MY HOME GROUP</strong>
            <span>My Profile</span>
          </div>
        </a>

        <div class="header-actions">

          <a
            href="/pages/notifications.html"
            class="icon-btn"
          >
            🔔
            <span
              class="notification-badge hidden"
            >
              0
            </span>
          </a>

        </div>

      </div>

    </header>

    <main class="page-content">

      <div class="page-title">

        <h1>MY PROFILE</h1>

        <p>
          Your account information.
        </p>

      </div>

      <section class="card profile-card">

        <div class="profile-avatar">
          👤
        </div>

        <div class="profile-details">

          <div class="profile-row">

            <span>Name</span>

            <strong id="profileName">
              Loading...
            </strong>

          </div>

          <div class="profile-row">

            <span>Email</span>

            <strong id="profileEmail">
              Loading...
            </strong>

          </div>

          <div class="profile-row">

            <span>Mobile</span>

            <strong id="profileMobile">
              Loading...
            </strong>

          </div>

          <div class="profile-row">

            <span>Role</span>

            <strong id="profileRole">
              Loading...
            </strong>

          </div>

          <div class="profile-row">

            <span>Company / Site</span>

            <strong id="profileCompany">
              Loading...
            </strong>

          </div>

        </div>

        <div class="profile-actions">

          <button
            class="btn btn-secondary"
            type="button"
            onclick="alert('Profile editing will be connected next.')"
          >
            Edit Profile
          </button>

          <button
            class="btn btn-secondary"
            type="button"
            onclick="alert('Change password page will be connected next.')"
          >
            Change Password
          </button>

          <button
            class="btn btn-secondary"
            type="button"
            onclick="alert('Settings will be connected next.')"
          >
            Settings
          </button>

          <button
            class="btn btn-danger"
            type="button"
            data-logout
          >
            Logout
          </button>

        </div>

      </section>

    </main>

    <nav class="bottom-nav">

      <div class="bottom-nav-inner">

        <a href="/dashboard">
          <span>🏠</span>
          <span>Home</span>
        </a>

        <a href="/pages/vehicles.html">
          <span>🚚</span>
          <span>Vehicles</span>
        </a>

        <a
          href="/pages/add-entry.html"
          class="entry-button"
        >
          <span>＋</span>
          <span>Entry</span>
        </a>

        <a href="/pages/calendar.html">
          <span>📅</span>
          <span>Calendar</span>
        </a>

        <a
          href="/pages/profile.html"
          class="active"
        >
          <span>👤</span>
          <span>You</span>
        </a>

      </div>

    </nav>

  </div>

  <script src="/app.js"></script>

</body>
</html>
