<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5a400">
  <title>Profile - Hyma RMC Kokapet</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <div class="app-page">

    <header class="top-header">

      <div>
        <h1>You</h1>
        <p>Your profile</p>
      </div>

    </header>

    <main class="page-content">

      <section class="profile-card">

        <div
          id="profileAvatar"
          class="profile-avatar"
        >
          👤
        </div>

        <h2 id="profileName">
          User
        </h2>

        <p id="profileEmail">
          -
        </p>

      </section>

      <section class="profile-info">

        <div class="profile-row">
          <span>Name</span>
          <strong id="profileNameValue">-</strong>
        </div>

        <div class="profile-row">
          <span>Email</span>
          <strong id="profileEmailValue">-</strong>
        </div>

        <div class="profile-row">
          <span>Mobile</span>
          <strong id="profileMobileValue">-</strong>
        </div>

        <div class="profile-row">
          <span>Role</span>
          <strong id="profileRoleValue">-</strong>
        </div>

        <div class="profile-row">
          <span>Company / Site</span>
          <strong id="profileCompanyValue">-</strong>
        </div>

      </section>

      <button
        id="reportsProfileBtn"
        class="secondary-btn full-width"
        type="button"
      >
        📊 Reports
      </button>

      <br>

      <button
        id="logoutBtn"
        class="primary-btn full-width"
        type="button"
      >
        Logout
      </button>

    </main>

    <nav class="bottom-nav">

      <button
        class="nav-item"
        data-page="dashboard"
        type="button"
      >
        <span>⌂</span>
        <small>Home</small>
      </button>

      <button
        class="nav-item"
        data-page="vehicles"
        type="button"
      >
        <span>🚚</span>
        <small>Vehicles</small>
      </button>

      <button
        class="nav-item add-nav"
        data-page="add-entry"
        type="button"
      >
        <span>+</span>
      </button>

      <button
        class="nav-item"
        data-page="calendar"
        type="button"
      >
        <span>▣</span>
        <small>Calendar</small>
      </button>

      <button
        class="nav-item active"
        data-page="profile"
        type="button"
      >
        <span>👤</span>
        <small>You</small>
      </button>

    </nav>

  </div>

  <script src="../app.js"></script>

</body>
</html>
