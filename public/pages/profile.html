<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Profile - My Home Group</title>

  <link rel="stylesheet" href="../style.css">

  <style>
    .page-wrap{
      max-width:900px;
      margin:0 auto;
      padding:20px;
      padding-bottom:105px;
    }

    .page-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      margin-bottom:20px;
    }

    .page-header h1{
      margin:0;
      font-size:26px;
    }

    .page-header p{
      margin:5px 0 0;
      font-size:13px;
      opacity:.65;
    }

    .back-btn{
      border:0;
      background:#eef1f4;
      border-radius:10px;
      padding:10px 13px;
      cursor:pointer;
      font-weight:700;
    }

    .card{
      background:#fff;
      border:1px solid #e3e7eb;
      border-radius:16px;
      padding:20px;
      margin-bottom:18px;
      box-shadow:0 3px 12px rgba(0,0,0,.04);
    }

    .profile-top{
      display:flex;
      align-items:center;
      gap:15px;
      margin-bottom:20px;
    }

    .avatar{
      width:65px;
      height:65px;
      border-radius:50%;
      background:#fff1bd;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:27px;
      font-weight:800;
    }

    .profile-top h2{
      margin:0;
      font-size:20px;
    }

    .profile-top p{
      margin:4px 0 0;
      font-size:12px;
      opacity:.65;
    }

    .role-badge{
      display:inline-block;
      margin-top:7px;
      padding:4px 8px;
      border-radius:20px;
      background:#edf7ef;
      color:#19733a;
      font-size:11px;
      font-weight:800;
    }

    .card h2{
      margin:0 0 15px;
      font-size:18px;
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .field label{
      display:block;
      font-size:12px;
      font-weight:700;
      margin-bottom:6px;
    }

    .field input{
      width:100%;
      box-sizing:border-box;
      padding:12px;
      border:1px solid #d8dde2;
      border-radius:10px;
      background:#fff;
    }

    .field input:disabled{
      background:#f5f6f7;
      color:#777;
    }

    .full{
      grid-column:1 / -1;
    }

    .form-actions{
      margin-top:15px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .info-row{
      display:flex;
      justify-content:space-between;
      gap:15px;
      padding:11px 0;
      border-bottom:1px solid #edf0f2;
      font-size:13px;
    }

    .info-row:last-child{
      border-bottom:0;
    }

    .info-label{
      opacity:.6;
    }

    .danger-card{
      border-color:#f0cfd2;
    }

    .danger-btn{
      border:0;
      background:#ffe5e7;
      color:#b42332;
      padding:11px 16px;
      border-radius:10px;
      font-weight:800;
      cursor:pointer;
    }

    .message{
      display:none;
      margin-top:12px;
      padding:10px 12px;
      border-radius:9px;
      font-size:13px;
    }

    .message.success{
      display:block;
      background:#eaf7ee;
      color:#176b35;
    }

    .message.error{
      display:block;
      background:#ffe9eb;
      color:#a51d2d;
    }

    .loading{
      text-align:center;
      padding:25px;
      opacity:.65;
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:5000;
      display:flex;
      justify-content:space-around;
      background:#fff;
      border-top:1px solid #ddd;
      padding:8px 5px calc(8px + env(safe-area-inset-bottom));
      box-shadow:0 -3px 12px rgba(0,0,0,.06);
    }

    .bottom-nav a{
      text-decoration:none;
      color:#555;
      font-size:11px;
      text-align:center;
      padding:6px 8px;
    }

    .bottom-nav a.active{
      color:#111;
      font-weight:800;
    }

    @media(max-width:650px){
      .page-wrap{
        padding:15px;
        padding-bottom:100px;
      }

      .page-header h1{
        font-size:22px;
      }

      .form-grid{
        grid-template-columns:1fr;
      }

      .full{
        grid-column:auto;
      }

      .profile-top{
        align-items:flex-start;
      }
    }
  </style>
</head>

<body>

  <main class="page-wrap">

    <!-- HEADER -->

    <header class="page-header">

      <div>
        <h1>👤 My Profile</h1>
        <p>Manage your account details</p>
      </div>

      <button
        class="back-btn"
        type="button"
        onclick="window.location.href='dashboard.html'"
      >
        ← Dashboard
      </button>

    </header>


    <!-- PROFILE -->

    <section class="card">

      <div class="profile-top">

        <div
          id="avatar"
          class="avatar"
        >
          U
        </div>

        <div>

          <h2 id="displayName">
            Loading...
          </h2>

          <p id="displayEmail">
            Loading...
          </p>

          <span
            id="roleBadge"
            class="role-badge"
          >
            User
          </span>

        </div>

      </div>


      <h2>
        Personal Information
      </h2>


      <form id="profileForm">

        <div class="form-grid">

          <div class="field">

            <label for="name">
              Name
            </label>

            <input
              id="name"
              type="text"
              required
              autocomplete="name"
            >

          </div>


          <div class="field">

            <label for="email">
              Email
            </label>

            <input
              id="email"
              type="email"
              disabled
            >

          </div>


          <div class="field">

            <label for="mobile">
              Mobile
            </label>

            <input
              id="mobile"
              type="tel"
              autocomplete="tel"
            >

          </div>


          <div class="field">

            <label for="company">
              Company / Site
            </label>

            <input
              id="company"
              type="text"
            >

          </div>

        </div>


        <div class="form-actions">

          <button
            class="btn btn-primary"
            type="submit"
          >
            Save Changes
          </button>

        </div>


        <div
          id="profileMessage"
          class="message"
        ></div>

      </form>

    </section>


    <!-- ACCOUNT INFO -->

    <section class="card">

      <h2>
        Account Information
      </h2>


      <div class="info-row">

        <span class="info-label">
          Account Role
        </span>

        <strong id="accountRole">
          -
        </strong>

      </div>


      <div class="info-row">

        <span class="info-label">
          Email
        </span>

        <strong id="accountEmail">
          -
        </strong>

      </div>


      <div class="info-row">

        <span class="info-label">
          Mobile
        </span>

        <strong id="accountMobile">
          -
        </strong>

      </div>


      <div class="info-row">

        <span class="info-label">
          Company / Site
        </span>

        <strong id="accountCompany">
          -
        </strong>

      </div>

    </section>


    <!-- PASSWORD -->

    <section class="card">

      <h2>
        🔐 Change Password
      </h2>


      <form id="passwordForm">

        <div class="form-grid">

          <div class="field">

            <label for="currentPassword">
              Current Password
            </label>

            <input
              id="currentPassword"
              type="password"
              required
              autocomplete="current-password"
            >

          </div>


          <div class="field">

            <label for="newPassword">
              New Password
            </label>

            <input
              id="newPassword"
              type="password"
              required
              minlength="6"
              autocomplete="new-password"
            >

          </div>


          <div class="field full">

            <label for="confirmPassword">
              Confirm New Password
            </label>

            <input
              id="confirmPassword"
              type="password"
              required
              minlength="6"
              autocomplete="new-password"
            >

          </div>

        </div>


        <div class="form-actions">

          <button
            class="btn btn-primary"
            type="submit"
          >
            Change Password
          </button>

        </div>


        <div
          id="passwordMessage"
          class="message"
        ></div>

      </form>

    </section>


    <!-- LOGOUT -->

    <section class="card danger-card">

      <h2>
        Account Actions
      </h2>

      <p style="font-size:13px;opacity:.65;">
        Logout from this device.
      </p>

      <button
        id="logoutButton"
        class="danger-btn"
        type="button"
      >
        Logout
      </button>

    </section>

  </main>


  <!-- MOBILE NAV -->

  <nav class="bottom-nav">

    <a href="dashboard.html">
      🏠<br>
      Home
    </a>

    <a href="vehicles.html">
      🚚<br>
      Vehicles
    </a>

    <a href="add-entry.html">
      ➕<br>
      Entry
    </a>

    <a href="calendar.html">
      📅<br>
      Calendar
    </a>

    <a
      href="profile.html"
      class="active"
    >
      👤<br>
      You
    </a>

  </nav>


  <script src="../app.js"></script>


  <script>
    "use strict";


    let currentUser = null;


    /* =====================================================
       HELPERS
    ===================================================== */

    function showMessage(
      elementId,
      message,
      type
    ){

      const element =
        document.getElementById(
          elementId
        );


      element.textContent =
        message;


      element.className =
        "message " +
        type;

    }


    function clearMessage(
      elementId
    ){

      const element =
        document.getElementById(
          elementId
        );


      element.textContent =
        "";


      element.className =
        "message";

    }


    /* =====================================================
       LOAD PROFILE
    ===================================================== */

    async function loadProfile(){

      try{

        currentUser =
          await window.MyHomeGroup
            .getMe();


        if(
          !currentUser
        ){

          throw new Error(
            "Unable to load profile."
          );

        }


        renderProfile();

      }catch(error){

        console.error(
          "Profile:",
          error
        );


        showMessage(
          "profileMessage",
          error.message ||
          "Unable to load profile.",
          "error"
        );

      }

    }


    /* =====================================================
       RENDER PROFILE
    ===================================================== */

    function renderProfile(){

      const name =
        currentUser.name ||
        "User";


      const email =
        currentUser.email ||
        "-";


      const mobile =
        currentUser.mobile ||
        "-";


      const company =
        currentUser.company ||
        "-";


      const role =
        currentUser.role ||
        "Security Guard";


      document.getElementById(
        "displayName"
      ).textContent =
        name;


      document.getElementById(
        "displayEmail"
      ).textContent =
        email;


      document.getElementById(
        "roleBadge"
      ).textContent =
        role;


      document.getElementById(
        "avatar"
      ).textContent =
        name
          .trim()
          .charAt(0)
          .toUpperCase() ||
        "U";


      document.getElementById(
        "name"
      ).value =
        name;


      document.getElementById(
        "email"
      ).value =
        email;


      document.getElementById(
        "mobile"
      ).value =
        mobile === "-"
          ? ""
          : mobile;


      document.getElementById(
        "company"
      ).value =
        company === "-"
          ? ""
          : company;


      document.getElementById(
        "accountRole"
      ).textContent =
        role;


      document.getElementById(
        "accountEmail"
      ).textContent =
        email;


      document.getElementById(
        "accountMobile"
      ).textContent =
        mobile;


      document.getElementById(
        "accountCompany"
      ).textContent =
        company;

    }


    /* =====================================================
       UPDATE PROFILE
    ===================================================== */

    document
      .getElementById(
        "profileForm"
      )
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();


          clearMessage(
            "profileMessage"
          );


          const name =
            document.getElementById(
              "name"
            ).value.trim();


          const mobile =
            document.getElementById(
              "mobile"
            ).value.trim();


          const company =
            document.getElementById(
              "company"
            ).value.trim();


          if(
            !name
          ){

            showMessage(
              "profileMessage",
              "Name is required.",
              "error"
            );

            return;

          }


          const button =
            event.submitter;


          const oldText =
            button.textContent;


          button.disabled =
            true;

          button.textContent =
            "Saving...";


          try{

            const updated =
              await window.MyHomeGroup
                .updateProfile({
                  name,
                  mobile,
                  company
                });


            currentUser =
              updated ||
              currentUser;


            renderProfile();


            showMessage(
              "profileMessage",
              "Profile updated successfully.",
              "success"
            );


          }catch(error){

            console.error(
              "Update profile:",
              error
            );


            showMessage(
              "profileMessage",
              error.message ||
              "Unable to update profile.",
              "error"
            );

          }finally{

            button.disabled =
              false;

            button.textContent =
              oldText;

          }

        }
      );


    /* =====================================================
       CHANGE PASSWORD
    ===================================================== */

    document
      .getElementById(
        "passwordForm"
      )
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();


          clearMessage(
            "passwordMessage"
          );


          const currentPassword =
            document.getElementById(
              "currentPassword"
            ).value;


          const newPassword =
            document.getElementById(
              "newPassword"
            ).value;


          const confirmPassword =
            document.getElementById(
              "confirmPassword"
            ).value;


          if(
            newPassword.length < 6
          ){

            showMessage(
              "passwordMessage",
              "New password must be at least 6 characters.",
              "error"
            );

            return;

          }


          if(
            newPassword !==
            confirmPassword
          ){

            showMessage(
              "passwordMessage",
              "New password and confirmation do not match.",
              "error"
            );

            return;

          }


          const button =
            event.submitter;


          const oldText =
            button.textContent;


          button.disabled =
            true;

          button.textContent =
            "Changing...";


          try{

            await window.MyHomeGroup
              .changePassword(
                currentPassword,
                newPassword
              );


            document.getElementById(
              "passwordForm"
            ).reset();


            showMessage(
              "passwordMessage",
              "Password changed successfully.",
              "success"
            );


          }catch(error){

            console.error(
              "Password:",
              error
            );


            showMessage(
              "passwordMessage",
              error.message ||
              "Unable to change password.",
              "error"
            );

          }finally{

            button.disabled =
              false;

            button.textContent =
              oldText;

          }

        }
      );


    /* =====================================================
       LOGOUT
    ===================================================== */

    document
      .getElementById(
        "logoutButton"
      )
      .addEventListener(
        "click",
        () => {

          window.MyHomeGroup
            .logout();

        }
      );


    /* =====================================================
       INIT
    ===================================================== */

    loadProfile();

  </script>

</body>
</html>
