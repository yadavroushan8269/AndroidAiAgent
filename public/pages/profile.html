<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reports — MY HOME GROUP</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <div class="page">

    <header class="app-header">

      <div class="app-header-inner">

        <a
          href="/dashboard"
          class="header-brand"
        >
          <div class="brand-logo">MH</div>

          <div>
            <strong>MY HOME GROUP</strong>
            <span>Reports</span>
          </div>
        </a>

        <div class="header-actions">

          <a
            href="/pages/notifications.html"
            class="icon-btn"
          >
            🔔
            <span
              class="notification-badge hidden"
            >
              0
            </span>
          </a>

          <a
            href="/pages/profile.html"
            class="icon-btn"
          >
            👤
          </a>

        </div>

      </div>

    </header>

    <main class="page-content">

      <div class="page-title">

        <h1>REPORTS</h1>

        <p>
          Generate vehicle duration reports.
        </p>

      </div>

      <section class="card">

        <div class="report-filters">

          <div class="form-group">

            <label for="reportPeriod">
              Period
            </label>

            <select
              id="reportPeriod"
              class="form-control"
            >
              <option value="daily">
                Daily
              </option>

              <option value="weekly">
                Weekly
              </option>

              <option value="monthly">
                Monthly
              </option>
            </select>

          </div>

          <div class="form-group">

            <label for="reportFrom">
              From
            </label>

            <input
              id="reportFrom"
              class="form-control"
              type="date"
            >

          </div>

          <div class="form-group">

            <label for="reportTo">
              To
            </label>

            <input
              id="reportTo"
              class="form-control"
              type="date"
            >

          </div>

          <div class="form-group">

            <label for="reportVehicle">
              Vehicle
            </label>

            <select
              id="reportVehicle"
              class="form-control"
            >
              <option value="">
                All
              </option>
            </select>

          </div>

          <div class="form-group">

            <label for="reportDriver">
              Driver
            </label>

            <select
              id="reportDriver"
              class="form-control"
            >
              <option value="">
                All
              </option>
            </select>

          </div>

          <div class="form-group">

            <label for="reportContractor">
              Contractor
            </label>

            <select
              id="reportContractor"
              class="form-control"
            >
              <option value="">
                All
              </option>
            </select>

          </div>

          <div class="full">

            <button
              class="btn btn-primary"
              type="button"
              onclick="generateReport()"
            >
              Generate Report
            </button>

          </div>

        </div>

      </section>

      <section
        class="stats-grid report-summary"
      >

        <div class="stat-card">

          <div class="stat-label">
            TOTAL VEHICLES
          </div>

          <div
            id="reportVehicles"
            class="stat-value primary"
          >
            0
          </div>

        </div>

        <div class="stat-card">

          <div class="stat-label">
            TOTAL ENTRIES
          </div>

          <div
            id="reportEntries"
            class="stat-value"
          >
            0
          </div>

        </div>

        <div class="stat-card">

          <div class="stat-label">
            TOTAL DURATION
          </div>

          <div
            id="reportDuration"
            class="stat-value success"
          >
            0h 0m
          </div>

        </div>

      </section>

      <div class="report-tabs">

        <button
          class="report-tab active"
          type="button"
        >
          Vehicle-wise
        </button>

        <button
          class="report-tab"
          type="button"
        >
          Driver-wise
        </button>

        <button
          class="report-tab"
          type="button"
        >
          Contractor-wise
        </button>

        <button
          class="report-tab"
          type="button"
        >
          Daily
        </button>

        <button
          class="report-tab"
          type="button"
        >
          Weekly
        </button>

        <button
          class="report-tab"
          type="button"
        >
          Monthly
        </button>

      </div>

      <section
        class="card"
        style="margin-top: 14px;"
      >

        <div class="table-wrap">

          <table class="data-table">

            <thead>
              <tr>
                <th>Date</th>
                <th>Vehicle</th>
                <th>Type</th>
                <th>Driver</th>
                <th>Contractor</th>
                <th>Entry</th>
                <th>Exit</th>
                <th>Duration</th>
              </tr>
            </thead>

            <tbody
              id="reportTableBody"
            >
              <tr>
                <td colspan="8">
                  <div class="loading">
                    Loading...
                  </div>
                </td>
              </tr>
            </tbody>

          </table>

        </div>

      </section>

      <div class="export-actions">

        <button
          class="btn btn-secondary"
          type="button"
          onclick="window.print()"
        >
          Export PDF
        </button>

        <button
          class="btn btn-primary"
          type="button"
          onclick="exportReportCSV()"
        >
          Export Excel
        </button>

      </div>

    </main>

    <nav class="bottom-nav">

      <div class="bottom-nav-inner">

        <a href="/dashboard">
          <span>🏠</span>
          <span>Home</span>
        </a>

        <a href="/pages/vehicles.html">
          <span>🚚</span>
          <span>Vehicles</span>
        </a>

        <a
          href="/pages/add-entry.html"
          class="entry-button"
        >
          <span>＋</span>
          <span>Entry</span>
        </a>

        <a href="/pages/calendar.html">
          <span>📅</span>
          <span>Calendar</span>
        </a>

        <a href="/pages/profile.html">
          <span>👤</span>
          <span>You</span>
        </a>

      </div>

    </nav>

  </div>

  <script src="/app.js"></script>

</body>
</html>
